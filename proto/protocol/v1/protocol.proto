syntax = "proto3";

package tbd.protocol.v1;

// gRPC surface of the protocol gateway itself, multiplexed on the same port as
// HTTP, WebSocket and GraphQL. Add gateway-owned RPCs here; engine RPCs stay in
// tbd.engine.v1.
service Gateway {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string gateway_version = 2;
}
