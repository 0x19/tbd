syntax = "proto3";

package tbd.runner.v1;

import "google/api/annotations.proto";

// The runner: the platform's way to run a program (RFC 0010). It knows who is
// asking, how many runs are in flight, what each caller has left today, and it
// writes the audit line; the sandbox on the machine does the running. A request
// is a language, a source and an input, and nothing else.
service RunnerService {
  // Echo a message. Proves configuration, telemetry and fault injection reach
  // an RPC.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {get: "/v1/runner/ping"};
  }
  // Compile and run one program, one file, the standard library only, in a
  // throwaway sandbox with no network, and answer what it printed. The caller's
  // role is required while the lab is private; a full queue or a spent daily
  // allowance is RESOURCE_EXHAUSTED with the reason.
  rpc Run(RunRequest) returns (RunResponse) {
    option (google.api.http) = {
      post: "/v1/runner/run"
      body: "*"
    };
  }
  // The languages the runner runs, and the caller's runs left today.
  rpc ListLanguages(ListLanguagesRequest) returns (ListLanguagesResponse) {
    option (google.api.http) = {get: "/v1/runner/languages"};
  }
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  // Version of the binary that answered.
  string version = 2;
  // True while the service is a placeholder with nothing real behind it.
  bool stub = 3;
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_GO = 1;
  LANGUAGE_RUST = 2;
}

message RunRequest {
  Language language = 1;
  // The whole program.
  string source = 2;
  // What the program reads on its standard input.
  string stdin = 3;
}

// One step of a run: the compiler, or the program.
message Step {
  // Absent when the step was stopped from outside.
  optional int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  // A stream passed its cap and was cut.
  bool truncated = 4;
  uint64 wall_ms = 5;
  // Why it was stopped from outside: "none", "timeout", "output", "memory",
  // "file_size" or "limit" (the whole sandbox reached its memory or process
  // limit).
  string killed = 6;
}

message RunResponse {
  string id = 1;
  Language language = 2;
  // "ok", "exit" (non-zero), "compile_error" or "killed".
  string outcome = 3;
  Step compile = 4;
  // Absent when it did not compile.
  Step run = 5;
  uint64 total_ms = 6;
  // The in-process stub answered, not a sandbox: nothing ran.
  bool stub = 7;
  // The caller's runs left today after this one.
  uint32 runs_left_today = 8;
}

message ListLanguagesRequest {}

message LanguageInfo {
  Language language = 1;
  // "go", "rust".
  string name = 2;
}

message ListLanguagesResponse {
  repeated LanguageInfo languages = 1;
  // The caller's runs left today; absent without a caller.
  optional uint32 runs_left_today = 2;
  // Runs in flight now, and the most at once.
  uint32 in_flight = 3;
  uint32 max_in_flight = 4;
  bool stub = 5;
}
