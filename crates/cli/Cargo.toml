[package]
name = "tbd-cli"
description = "The `tbd` binary: scaffolds services from templates and registers them in every shared file, idempotently. Owns no runtime code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tbd"
path = "src/main.rs"

[dependencies]
tbd-common.workspace = true

anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
owo-colors = { workspace = true, features = ["supports-colors"] }
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
