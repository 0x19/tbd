[package]
name = "tbd-chaos"
description = "Validation, load and fault-injection tool. Starts the real services in-process, drives them, injects faults on a timeline and asserts. A framework with two extension points: Service and Operation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "chaos"
path = "src/main.rs"

[dependencies]
tbd-common.workspace = true
tbd-engine.workspace = true
tbd-proto.workspace = true
prost-types.workspace = true
tbd-protocol.workspace = true
tbd-humans.workspace = true
tbd-ledger.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
clap.workspace = true
futures.workspace = true
glob.workspace = true
hdrhistogram.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
toml.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
tonic-health.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "cors"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
chrono.workspace = true
croner = { version = "4", features = ["chrono"] }

[dev-dependencies]
serde.workspace = true
toml.workspace = true

[lints]
workspace = true
