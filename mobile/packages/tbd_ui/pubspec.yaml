name: tbd_ui
description: The design system every product's app shares - the web kit's tokens (generated from its CSS) as a Flutter theme, light and dark, the kit's faces bundled, and the primitives built on it. Widgets only; no data, no navigation.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # The web kit's faces, bundled so nothing is fetched at runtime: Inter (the
  # same files the invoice PDF is set in, crates/finance/assets/fonts) and
  # Geist Mono (SIL OFL, fonts/LICENSE-GeistMono.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.otf
        - asset: fonts/Inter-Medium.otf
          weight: 500
        - asset: fonts/Inter-SemiBold.otf
          weight: 600
        - asset: fonts/Inter-Bold.otf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
