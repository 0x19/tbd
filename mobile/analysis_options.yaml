# The workspace's lints: very_good_analysis, strict. The same bar as clippy
# with pedantic on and warnings as errors -- `dart analyze --fatal-infos`
# fails on any finding.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated code is excluded below, so anything left is ours to fix.
    todo: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbjson.dart"
    - "**/*.pbgrpc.dart"
    - "**/gen/**"
    - "build/**"

linter:
  rules:
    # A public app has no reason to leave debug prints in.
    avoid_print: true
    # Every user-facing string goes through l10n; literals in widgets are a smell.
    prefer_const_constructors: true
