name: tbd_mobile
description: The shell every product starts from - sign in through the SSO, a hello from the backend, sign out. Features are packages; this is the app that hosts them.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.0.0
  intl: ^0.20.3
  tbd_api:
    path: ../../packages/tbd_api
  tbd_auth:
    path: ../../packages/tbd_auth
  tbd_core:
    path: ../../packages/tbd_core
  tbd_proto:
    path: ../../packages/tbd_proto
  tbd_ui:
    path: ../../packages/tbd_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  tbd_testing:
    path: ../../packages/tbd_testing
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # ARB files under lib/l10n become AppLocalizations (flutter gen-l10n / mobile:gen).
  generate: true
