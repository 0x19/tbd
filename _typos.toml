[default]
extend-ignore-re = ["[0-9a-f]{7,40}"]

[files]
extend-exclude = [
  "target/",
  "Cargo.lock",
  "docs/design/",
  # The finance UI's dictionaries are bilingual by design (en and hr side by side).
  "ui/finances/src/lib/i18n/messages/",
  # The accountant's NDA: the Croatian version, which the checker reads as English.
  "docs/nda/nda.hr.md",
  # Merchant names as printed on bank statements; a rule must match them as spelled.
  "crates/finance/seeds/rules.sql",
  # The accountant's 2025 filings quoted verbatim: Croatian account and position names.
  "docs/accountant/gfi-2025.md",
  "docs/accountant/rules.md",
  "docs/accountant/email.md",
  # An ePorezna form as filed: Croatian element names and the company's own data.
  "crates/finance/tests/fixtures/filings/",
  "docs/accountant/expected/",
  # The chart of accounts: the accountant's Croatian account names, verbatim.
  "configs/finance/hr/",
  # mobile: buf-generated Dart (protobuf's own accessor names) and Xcode's storyboard ids.
  "mobile/packages/tbd_proto/lib/gen/",
  "mobile/apps/*/ios/",
]

[default.extend-identifiers]
UPnP = "UPnP"
OTFs = "OTFs"
# Loop indices in a comparator, not "it".
iy = "iy"
ix = "ix"

[default.extend-words]
# Year-over-year, the finance overview's second chart.
yoy = "yoy"
# The Middle East and North Africa region, in the CV.
MENA = "MENA"
# Croatian, where an English page carries a Croatian word on purpose: "tema" (theme)
# in the plural-rule comment, "paket" (package) in a mail fixture.
tema = "tema"
# Croatian "vas" (you), in the cv UI
vas = "vas"
paket = "paket"
# A date regex's ordinal suffixes (1st, 2nd, 3rd).
nd = "nd"
# ePorezna's XML: the namespace path `/sheme/` (schemes) and the `Autor` element.
sheme = "sheme"
autor = "autor"
