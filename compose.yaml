# Local stack: engine (gRPC) + protocol (HTTP/WS/GraphQL protocol) + Envoy + chaos serve
# + the identity stack (Postgres, Ory Hydra, Ory Kratos, login UI) that Envoy verifies
# tokens against. Sign in at http://auth.localhost:8080/, API at http://localhost:8080.
#
#   docker compose up --build
#   docker compose down -v
#
# The secrets below default to local-only values; set them in .env for anything shared.
#
# Images are distroless (no shell, no curl), so compose-level healthchecks cannot exec inside
# the container. Readiness here is "process is up"; real probes live in devops/k8s. The
# protocol service retries its engine connection on start, so start order is only a courtesy.
name: tbd

x-common-env: &common-env
  RUST_LOG: ${RUST_LOG:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Set to an OTLP/gRPC collector to export traces, e.g. http://alloy:4317.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}

services:
  engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-engine:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: engine
        PORT: "50051"
    environment:
      <<: *common-env
      ENGINE_LISTEN_ADDR: 0.0.0.0:50051
      ENGINE_METRICS_ADDR: 0.0.0.0:9464
    ports:
      - "9464:9464"
    restart: unless-stopped

  protocol:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-protocol:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: protocol
        PORT: "8080"
    environment:
      <<: *common-env
      PROTOCOL_LISTEN_ADDR: 0.0.0.0:8080
      PROTOCOL_METRICS_ADDR: 0.0.0.0:9465
      PROTOCOL_ENGINE_URL: http://envoy:50051
    ports:
      - "9465:9465"
    depends_on:
      - engine
    restart: unless-stopped

  chaos:
    # chaos API (and admin UI when ui/chaos/out was built into the image):
    # http://localhost:8080/api/chaos/v1/overview and http://chaos.localhost:8080/ via Envoy.
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-chaos:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: chaos
        PORT: "7700"
    command: ["serve"]
    environment:
      <<: *common-env
      TBD_ENV: ${TBD_ENV:-local}
      CHAOS_LISTEN_ADDR: 0.0.0.0:7700
      CHAOS_PROTOCOL_URL: http://envoy:8080
      CHAOS_ENGINE_URL: http://envoy:50051
      CHAOS_LEDGER_URL: http://envoy:50051
      CHAOS_RESULTS_DIR: /data/results
      CHAOS_SCHEDULES_FILE: /data/schedules.json
      CHAOS_STACK_FILE: /data/stack.json
      # Slack incoming webhook for run notifications (docs/chaos/config.md); empty = off.
      CHAOS_SLACK_WEBHOOK: ${CHAOS_SLACK_WEBHOOK:-}
      CHAOS_SCENARIOS_DIR: /data/scenarios
      CHAOS_SCENARIOS_SEED: /app/scenarios
      CHAOS_UI_DIR: /app/ui
      # Base domain of the public edge (devops/edge); empty keeps localhost links.
      CHAOS_PUBLIC_DOMAIN: ${BASE_DOMAIN:-}
      # Tokens for validate/load through Envoy (docs/auth/README.md).
      CHAOS_AUTH_TOKEN_URL: http://hydra:4444/oauth2/token
      CHAOS_AUTH_CLIENT_ID: tbd-chaos
      CHAOS_AUTH_CLIENT_SECRET: ${AUTH_CLIENT_CHAOS_SECRET:-local-chaos-secret}
    volumes:
      - chaos-results:/data
    tmpfs:
      - /tmp
    restart: unless-stopped

  ledger:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-ledger:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: ledger
        PORT: "50052"
    environment:
      <<: *common-env
      TBD_ENV: ${TBD_ENV:-local}
      LEDGER_LISTEN_ADDR: 0.0.0.0:50052
      LEDGER_METRICS_ADDR: 0.0.0.0:9464
    ports:
      - "9466:9464"
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.39.1
    # Renders the one environment-specific value (the browser-facing auth URL) and
    # the OAuth2 filter's file-based secrets, then starts Envoy.
    command:
      - sh
      - -ec
      - |
        sed "s|__AUTH_PUBLIC_URL__|$$AUTH_PUBLIC_URL|g" /template/envoy.yaml > /tmp/envoy.yaml
        mkdir -p /etc/envoy/secrets
        for n in token hmac; do
          v=$$(eval echo "\$$OAUTH_$${n}_SECRET")
          printf 'resources:\n  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret\n    name: oauth-%s-secret\n    generic_secret:\n      secret: { inline_string: "%s" }\n' "$$n" "$$v" > /etc/envoy/secrets/$$n.yaml
        done
        exec envoy -c /tmp/envoy.yaml --service-cluster envoy --service-node compose
    environment:
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://auth.localhost:8080}
      OAUTH_token_SECRET: ${AUTH_CLIENT_UI_SECRET:-local-ui-secret}
      OAUTH_hmac_SECRET: ${ENVOY_OAUTH_HMAC:-local-hmac-secret-change-me}
    volumes:
      - ./devops/envoy/envoy.yaml:/template/envoy.yaml:ro
    ports:
      - "8080:8080"    # edge: REST, SSE, GraphQL, WebSocket, gRPC
      - "50051:50051"  # engine load balancer
      - "9901:9901"    # admin
    depends_on:
      - engine
      - protocol
      - chaos
      - ledger
      - hydra
      - kratos
      - auth-ui
    restart: unless-stopped

  # ---- identity stack: the same config files as devops/k8s/auth, rendered the same way.
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-local-postgres}
    volumes:
      - auth-postgres:/var/lib/postgresql/data
      - ./devops/k8s/auth/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hydra:
    image: oryd/hydra:v26.2.0
    command:
      - sh
      - -ec
      - |
        sed "s|__AUTH_PUBLIC_URL__|$$AUTH_PUBLIC_URL|g; s|__BASE_DOMAIN__|$$BASE_DOMAIN|g" /template/hydra.yml > /tmp/hydra.yml
        hydra migrate sql -e --yes -c /tmp/hydra.yml
        exec hydra serve all -c /tmp/hydra.yml --dev
    environment:
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://auth.localhost:8080}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      DSN: postgres://auth:${AUTH_POSTGRES_PASSWORD:-local-postgres}@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:-local-hydra-system-secret-change-me}
    volumes:
      - ./devops/k8s/auth/config:/template:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kratos:
    image: oryd/kratos:v26.2.0
    command:
      - sh
      - -ec
      - |
        sed "s|__AUTH_PUBLIC_URL__|$$AUTH_PUBLIC_URL|g; s|__BASE_DOMAIN__|$$BASE_DOMAIN|g; s|hydra-admin.auth.svc|hydra|g; s|kratos-admin.auth.svc|kratos|g" /template/kratos.yml > /tmp/kratos.yml
        cp /template/identity.schema.json /template/oidc.*.jsonnet /tmp/
        sed "s|/config/oidc.yml|/tmp/oidc.yml|" /template/oidc.sh | sh
        sed "s|/config/flows.yml|/tmp/flows.yml|; s|__BASE_DOMAIN__|$$BASE_DOMAIN|g" /template/flows.sh | sh
        sed -i "s|/etc/config/kratos/|/tmp/|g" /tmp/kratos.yml /tmp/oidc.yml
        kratos migrate sql -e --yes -c /tmp/kratos.yml -c /tmp/oidc.yml -c /tmp/flows.yml
        exec kratos serve all -c /tmp/kratos.yml -c /tmp/oidc.yml -c /tmp/flows.yml --dev
    environment:
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://auth.localhost:8080}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      DSN: postgres://auth:${AUTH_POSTGRES_PASSWORD:-local-postgres}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:-local-kratos-cookie-secret-change}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:-local-kratos-cipher-32-chars-xx}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      COURIER_SMTP_CONNECTION_URI: ${SMTP_URI:-}
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
    volumes:
      - ./devops/k8s/auth/config:/template:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  auth-ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-auth-ui:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.auth-ui
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_ADMIN_URL: http://hydra:4445
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://auth.localhost:8080}
      TRUSTED_CLIENT_IDS: tbd-ui,tbd-app
    depends_on:
      - kratos
      - hydra
    restart: unless-stopped

  # Registers the OAuth2 clients (same script as devops/k8s/auth/seed-clients.yaml).
  seed-clients:
    image: curlimages/curl:8.16.0
    environment:
      HYDRA_ADMIN: http://hydra:4445
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://auth.localhost:8080}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CLIENT_UI_SECRET: ${AUTH_CLIENT_UI_SECRET:-local-ui-secret}
      CLIENT_CHAOS_SECRET: ${AUTH_CLIENT_CHAOS_SECRET:-local-chaos-secret}
    volumes:
      - ./devops/k8s/auth/seed-clients.sh:/seed.sh:ro
    command: ["sh", "-e", "/seed.sh"]
    depends_on:
      - hydra
    restart: on-failure

volumes:
  chaos-results:
  auth-postgres:
