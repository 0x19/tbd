# Local stack: engine (gRPC) + protocol (HTTP/WS/GraphQL protocol) + Envoy + chaos serve.
#
#   docker compose up --build
#   docker compose down -v
#
# Images are distroless (no shell, no curl), so compose-level healthchecks cannot exec inside
# the container. Readiness here is "process is up"; real probes live in devops/k8s. The
# protocol service retries its engine connection on start, so start order is only a courtesy.
name: tbd

x-common-env: &common-env
  RUST_LOG: ${RUST_LOG:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Set to an OTLP/gRPC collector to export traces, e.g. http://alloy:4317.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}

services:
  engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-engine:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: engine
        PORT: "50051"
    environment:
      <<: *common-env
      ENGINE_LISTEN_ADDR: 0.0.0.0:50051
      ENGINE_METRICS_ADDR: 0.0.0.0:9464
    ports:
      - "9464:9464"
    restart: unless-stopped

  protocol:
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-protocol:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: protocol
        PORT: "8080"
    environment:
      <<: *common-env
      PROTOCOL_LISTEN_ADDR: 0.0.0.0:8080
      PROTOCOL_METRICS_ADDR: 0.0.0.0:9465
      PROTOCOL_ENGINE_URL: http://envoy:50051
    ports:
      - "9465:9465"
    depends_on:
      - engine
    restart: unless-stopped

  chaos:
    # chaos API (and admin UI when ui/chaos/out was built into the image):
    # http://localhost:8080/api/chaos/overview and http://localhost:8080/chaos/ via Envoy.
    image: ${IMAGE_REGISTRY:-ghcr.io/0x19}/tbd-chaos:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: devops/docker/Dockerfile
      args:
        BIN: chaos
        PORT: "7700"
    command: ["serve"]
    environment:
      <<: *common-env
      TBD_ENV: ${TBD_ENV:-local}
      CHAOS_LISTEN_ADDR: 0.0.0.0:7700
      CHAOS_PROTOCOL_URL: http://envoy:8080
      CHAOS_ENGINE_URL: http://envoy:50051
      CHAOS_RESULTS_DIR: /data/results
      CHAOS_SCENARIOS_DIR: /data/scenarios
      CHAOS_SCENARIOS_SEED: /app/scenarios
      CHAOS_UI_DIR: /app/ui
    volumes:
      - chaos-results:/data
    tmpfs:
      - /tmp
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.39.1
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "envoy", "--service-node", "compose"]
    volumes:
      - ./devops/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"    # edge: REST, SSE, GraphQL, WebSocket, gRPC
      - "50051:50051"  # engine load balancer
      - "9901:9901"    # admin
    depends_on:
      - engine
      - protocol
      - chaos
    restart: unless-stopped

volumes:
  chaos-results:
