name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  REGISTRY: ghcr.io
  # Image namespace. Defaults to the repository owner; override with a repo variable ORG.
  ORG: ${{ vars.ORG || github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: nextest + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc

  scaffold:
    name: tbd selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
      - run: mise run tbd:selfcheck

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  docker:
    name: image (${{ matrix.bin }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: engine
            port: "50051"
          - bin: protocol
            port: "8080"
          - bin: chaos
            port: "7700"
          - bin: ledger
            port: "50052"
    steps:
      - uses: actions/checkout@v6
      # The chaos image carries the admin UI when ui/chaos/out exists.
      - uses: pnpm/action-setup@v4
        if: matrix.bin == 'chaos'
        with:
          package_json_file: ui/chaos/package.json
      - uses: actions/setup-node@v4
        if: matrix.bin == 'chaos'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/chaos/pnpm-lock.yaml
      - if: matrix.bin == 'chaos'
        working-directory: ui/chaos
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/tbd-${{ matrix.bin }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          build-args: |
            BIN=${{ matrix.bin }}
            PORT=${{ matrix.port }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bin }}

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1

  ui:
    name: ui/chaos (prettier + eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/chaos
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/chaos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/chaos/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  proto:
    name: buf lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: true
          breaking: false
          push: false

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc --locked --workspace --all-features --no-deps

  scenarios:
    name: chaos scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo run --locked -p tbd-chaos -- check scenarios/*.toml
      - run: cargo run --locked -p tbd-chaos -- run --dir scenarios
        env:
          RUST_LOG: warn,tbd_chaos=info,tbd_protocol::error=off,tower_http=off
