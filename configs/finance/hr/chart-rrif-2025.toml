# The chart of accounts the books are seeded with: RRiF-ov računski plan za
# poduzetnike, XXVIII. izdanje (2025) numbering (docs/accountant/rules.md §1).
#
# Every account the accountant used in the 2025 books (docs/accountant/gfi-2025.md
# §1, 77 rows) is here under its own code and name, and every synthetic account
# they sit under. A synthetic account takes no posting; an analytic one names its
# parent, the longest account code that is a prefix of its own. Class and kind
# are not written here: the code's first digit decides them (0/1/3 asset,
# 2 liability, 4 expense, 7 revenue, 8 result, 9 equity).
#
# Synthetic names are working titles from the accountant's analytics and the
# RRiF class headings; the paid RRiF edition has the verbatim ones. Adding an
# account here adds it to every party on their next books call; an account a
# party adds itself goes through UpsertLedgerAccount instead.

[chart]
name = "RRiF XXVIII (2025)"
edition = "2025"

