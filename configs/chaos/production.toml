# Production. chaos is not deployed here (see devops/k8s/overlays/prod); this
# file exists so `chaos validate --env production` from an operator's machine
# points at the right place once the domain is known.

[targets]
protocol = "https://api.example.invalid"
engine = "https://engine.api.example.invalid"
# Internal only; not reachable from the edge.
ledger = "https://engine.api.example.invalid"

[serve]
start_stack = false

[notify.slack]
channel = "#chaos-prod"
# Production is loud: cancelled runs are worth a look too.
on = ["failed", "error", "cancelled"]
