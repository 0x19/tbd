# chaos configuration, shared layer. `configs/chaos/<env>.toml` is merged over
# this file; tables merge key by key, any other value replaces. Every key is
# listed here so an environment file only needs what it changes. Flags and
# their environment variables (see docs/chaos/commands.md) override both.

[serve]
# Where `chaos serve` listens. In-cluster this is overridden to 0.0.0.0 by
# CHAOS_LISTEN_ADDR.
listen = "127.0.0.1:7700"
# Prefix for every API route, versioned. Envoy forwards everything under /api/chaos/
# here, so a v2 can sit next to v1 behind the same routes.
base_path = "/api/chaos/v1"
# Built UI to serve at `ui_path`. Empty ui_dir: no UI, API only.
# Empty ui_path: the root of the host (http://localhost:7700/); the API keeps base_path.
ui_dir = ""
ui_path = ""
# Start the [paths].topology stack when `serve` starts.
start_stack = true

[paths]
# Stack `chaos up` and `chaos serve` run in-process.
topology = "topologies/dev.toml"
# Scenario files the API lists, edits and runs.
scenarios = "scenarios"
# Copied into `scenarios` when `serve` starts and that directory is missing or
# empty. Used in containers: the image's scenarios/ is read-only, the copy on
# /data is what the UI edits. Empty: no seeding.
scenarios_seed = ""
# Where run records (scenario, load, validate) are written as JSON.
results = ".chaos/results"

[targets]
# Defaults for `chaos validate` and for API load runs against an external stack.
protocol = "http://127.0.0.1:8080"
engine = "http://127.0.0.1:50051"

[validate]
timeout = "5s"
# Extra PEM root for https:// and wss:// targets (a staging edge, Caddy's
# internal CA). Empty: the public roots compiled into the binary.
ca_cert = ""

[auth]
# Bearer token for validate and load runs against a deployed stack: Envoy admits
# API calls only with a JWT from the identity provider (docs/auth/README.md).
# In-process stacks (chaos up, scenarios) need none. Either a fixed token
# (`token`, --token, CHAOS_TOKEN) or the client-credentials grant below; empty
# token_url means no token is sent. The secret only ever comes from
# CHAOS_AUTH_CLIENT_SECRET.
token = ""
token_url = ""
client_id = "tbd-chaos"
client_secret = ""
scope = "tbd.api"
audience = "tbd-api"

[links]
# Where the UI sends people. Set `domain` and every link is derived from the
# public edge's fixed hosts (devops/edge/Caddyfile): grafana.<domain>,
# logs.<domain>, profiles.<domain>, metrics.<domain>; envoy_admin is never
# public. Without a domain the explicit URLs below are used; empty hides a link.
# In the cluster CHAOS_PUBLIC_DOMAIN (from devops/edge/.env BASE_DOMAIN) sets it.
domain = ""
grafana = ""
victorialogs = ""
metrics = ""
pyroscope = ""
envoy_admin = ""
