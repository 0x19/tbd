# protocol configuration, shared layer. `configs/protocol/<env>.toml` is merged
# over this file (tables merge key by key, any other value replaces), then flags
# and their environment variables (PROTOCOL_*) override both. Every key is listed
# here so an environment file only needs what it changes.
#
# `PROTOCOL_<NAME>_URL` overrides `[services.<name>] url` for any registered
# service; `--service-url name=URL` is the flag form.

[server]
# HTTP/1.1 and h2c (gRPC) on one port. Loopback on purpose; containers bind
# 0.0.0.0 through PROTOCOL_LISTEN_ADDR.
listen = "127.0.0.1:8080"

[metrics]
# Prometheus /metrics listener. Embedders (tests, the chaos tool) turn it off.
listen = "0.0.0.0:9465"

# The backends this gateway forwards to, one lazy gRPC channel each (channels to
# the same url are shared). `service` is the grpc.health.v1 name probed and
# re-reported on the protocol's own health service; `required` backends gate
# /readyz, the others are reported but never fail it. Deployed environments
# point every url at Envoy's internal listener, which routes by service name.
[services.engine]
url = "http://127.0.0.1:50051"
service = "tbd.engine.v1.EngineService"
required = true

[services.humans]
url = "http://127.0.0.1:50053"
service = "tbd.humans.v1.HumansService"
required = false

[services.ledger]
url = "http://127.0.0.1:50052"
service = "tbd.ledger.v1.LedgerService"
required = false
[services.finance]
url = "http://127.0.0.1:50054"
service = "tbd.finance.v1.FinanceService"
required = false
[services.playground]
url = "http://127.0.0.1:50055"
service = "tbd.playground.v1.PlaygroundService"
required = false
[services.cv]
url = "http://127.0.0.1:50056"
service = "tbd.cv.v1.CvService"
required = false
[services.llm]
url = "http://127.0.0.1:50057"
service = "tbd.llm.v1.LlmService"
required = false
# tbd:services-end (tbd new service inserts above this line; do not edit)

[health]
# Every backend is probed every probe_interval; a probe slower than
# probe_timeout counts as NOT_SERVING. /readyz is a live probe with the same
# timeout, which keeps it inside Envoy's health-check budget.
probe_interval = "5s"
probe_timeout = "1s"

[socket]
# The multiplexed WebSocket at /v1/ws: every public RPC over one connection,
# calls told apart by the id the client picks. A client may keep max_calls
# calls in flight; a larger frame than max_frame_bytes is refused by the
# WebSocket layer, so keep it at or under the REST body cap.
max_calls = 64
max_frame_bytes = 262144

[mcp]
# Every public RPC as an MCP tool at /mcp (streamable HTTP, stateless), named
# <backend>_<method> and described by the contract's comments. The caller is
# whoever the gateway verified, as on every other surface. A streaming tool is
# collected into one answer: at most max_stream_items messages, at most
# stream_timeout long; what it has by then is the answer, marked as cut.
enabled = true
max_stream_items = 512
stream_timeout = "300s"
max_body_bytes = 2097152

[principals]
# Token subjects that are our own services (callers of kind `service`). Empty
# until the id plane mints service credentials.
services = []
