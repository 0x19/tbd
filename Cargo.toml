[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/engine", "crates/protocol", "crates/chaos", "crates/ledger", "crates/humans"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/0x19/tbd"
publish = false

[workspace.dependencies]
# internal
tbd-common   = { path = "crates/common" }
tbd-proto    = { path = "crates/proto" }
tbd-engine   = { path = "crates/engine" }
tbd-protocol = { path = "crates/protocol" }
tbd-chaos    = { path = "crates/chaos" }
tbd-cli      = { path = "crates/cli" }
tbd-ledger   = { path = "crates/ledger" }
tbd-humans   = { path = "crates/humans" }

# async runtime
tokio        = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util   = "0.7"
futures      = "0.3"

# grpc
tonic             = "0.14"
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
tonic-health      = "0.14"
tonic-reflection  = "0.14"
tonic-types       = "0.14"
prost             = "0.14"
prost-types       = "0.14"
protox            = "0.9"

# http / ws / graphql
axum               = { version = "0.8", features = ["ws", "http2", "json"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["trace", "cors"] }
http               = "1"
async-graphql      = { version = "7.2", features = ["playground"] }
async-graphql-axum = "7.2"
async-trait        = "0.1"
tempfile           = "3"

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# cli / config
clap = { version = "4.6", features = ["derive", "env"] }

# errors
thiserror = "2"
base64            = "0.22"
anyhow    = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry      = "0.32"
opentelemetry_sdk  = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32"
metrics            = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
metrics-process    = "2"
pyroscope          = "0.5"   # the pprof-rs backend targets this line; 2.x is a different API
pyroscope_pprofrs  = "0.2"

# misc
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono          = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2            = "0.10"
proptest        = "1"
rand            = "0.9"
humantime       = "2"
humantime-serde = "1"
toml            = "1"
glob            = "0.3"
url             = "2"
hdrhistogram    = "7"
comfy-table     = "7"
owo-colors      = "4"

# clients (chaos, tests)
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = "0.29"

# storage (ledger). rustls only: cargo-deny bans openssl.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "chrono", "json",
] }
testcontainers = { version = "0.27", default-features = false, features = ["ring"] }
clickhouse = { version = "0.15", default-features = false, features = ["lz4", "uuid", "chrono"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols and line tables stay in: the eBPF profiler needs function names and
# frame pointers (see .cargo/config.toml) to draw flame graphs of the release
# binaries. Costs some tens of MB per image, nothing at runtime.
strip = "none"
debug = "line-tables-only"
