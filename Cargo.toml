[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/engine", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ORG/tbd"
publish = false

[workspace.dependencies]
# internal
tbd-common   = { path = "crates/common" }
tbd-proto    = { path = "crates/proto" }
tbd-engine   = { path = "crates/engine" }
tbd-protocol = { path = "crates/protocol" }

# async runtime
tokio        = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util   = "0.7"
futures      = "0.3"

# grpc
tonic             = "0.14"
tonic-prost       = "0.14"
tonic-prost-build = "0.14"
tonic-health      = "0.14"
tonic-reflection  = "0.14"
prost             = "0.14"
prost-types       = "0.14"
protox            = "0.9"

# http / ws / graphql
axum               = { version = "0.8", features = ["ws", "http2", "json"] }
tower              = "0.5"
tower-http         = { version = "0.7", features = ["trace", "cors"] }
http               = "1"
async-graphql      = { version = "7.2", features = ["playground"] }
async-graphql-axum = "7.2"

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# cli / config
clap = { version = "4.6", features = ["derive", "env"] }

# errors
thiserror = "2"
anyhow    = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# misc
uuid = { version = "1", features = ["v4", "v7"] }

# dev
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = "0.28"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
