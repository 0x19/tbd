[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 3 }

# The ledger's database tests start a container each (or use the CI service);
# give them room and keep two at a time from saturating Docker.
[[profile.default.overrides]]
filter = 'package(tbd-ledger) & (test(/^pg::/) | test(/^clickhouse::/))'
slow-timeout = { period = "120s", terminate-after = 2 }
threads-required = 2

[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(tbd-ledger) & (test(/^pg::/) | test(/^clickhouse::/))'
slow-timeout = { period = "180s", terminate-after = 2 }
threads-required = 2

[profile.ci.junit]
path = "junit.xml"
