# Developer experience entrypoint. `mise run` lists tasks; `make <task>` delegates here.
# Rust itself is managed by rustup via rust-toolchain.toml, not by mise, so plain
# `cargo` works for people who do not use mise.

[settings]
experimental = true

[settings.pipx]
uvx = true

[env]
_.file = [".env"]
RUST_LOG = "info,tbd=debug"
LOG_FORMAT = "text"
IMAGE_REGISTRY = "ghcr.io/0x19"
IMAGE_TAG = "dev"
KUBE_OVERLAY = "dev"
K3D_CLUSTER = "tbd"
K3D_STORAGE = "/mnt/raid0/tbd-k3d/storage"
ANSIBLE_INVENTORY = "inventory/dev.yml"

[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-hack" = "latest"
"cargo:cargo-shear" = "latest"
"cargo:bacon" = "latest"
buf = "latest"
typos = "latest"
kubectl = "latest"
kustomize = "latest"
k3d = "latest"
k9s = "latest"
helm = "latest"
grpcurl = "latest"
websocat = "latest"
uv = "latest"
"pipx:ansible-core" = "latest"
# ui/chaos (Next.js). node is pinned to the line the kit targets; pnpm is its package manager.
node = "24"
pnpm = "latest"

# ---------------------------------------------------------------- build ----

[tasks.setup]
description = "Install toolchain components and every tool above"
run = ["rustup show active-toolchain", "mise install"]

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.build]
description = "Debug build of both services"
run = "cargo build --workspace"

[tasks."build:release"]
description = "Release build of both services"
run = "cargo build --workspace --release"

[tasks.clean]
run = "cargo clean"

# ------------------------------------------------------------- quality ----

[tasks.fmt]
description = "Format Rust and proto sources"
run = ["cargo fmt --all", "buf format -w proto"]

[tasks."fmt:check"]
run = ["cargo fmt --all --check", "buf format -d --exit-code proto"]

[tasks.lint]
description = "Clippy with warnings as errors, plus proto lint"
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "buf lint proto",
]

[tasks.test]
description = "Unit + integration tests (nextest) and doctests"
# The progress bar writes carriage returns, which smear into one line when
# output goes through mise. The per-test list is what we want anyway.
env = { NEXTEST_HIDE_PROGRESS_BAR = "1" }
run = [
  "cargo nextest run --workspace --all-features",
  "cargo test --workspace --doc",
]

[tasks.validate]
description = "Hit every surface of a running stack (CHAOS_PROTOCOL_URL / CHAOS_ENGINE_URL to override)"
run = "cargo run -q -p tbd-chaos -- validate"

[tasks."chaos:up"]
description = "Run the dev topology (topologies/dev.toml) in one process until Ctrl-C"
run = "cargo run -q -p tbd-chaos -- up topologies/dev.toml"

[tasks."chaos:serve"]
description = "chaos API on :7700 with the dev topology in-process (TBD_ENV picks configs/chaos/<env>.toml); serves ui/chaos/out when built"
run = "cargo run -q -p tbd-chaos -- serve --ui-dir ui/chaos/out $CHAOS_ARGS"

[tasks."chaos:config"]
description = "Print the effective chaos config for TBD_ENV (base.toml + <env>.toml)"
run = "cargo run -q -p tbd-chaos -- config"

# ------------------------------------------------------------------- ui ----

[tasks."ui:install"]
description = "Install ui/chaos dependencies (pnpm, lockfile-exact)"
dir = "ui/chaos"
run = "pnpm install --frozen-lockfile"

[tasks."ui:dev"]
description = "ui/chaos dev server on :3001 against chaos serve on :7700 (NEXT_PUBLIC_CHAOS_API to override)"
dir = "ui/chaos"
run = "pnpm dev"

[tasks."ui:build"]
description = "Static export of ui/chaos into ui/chaos/out, served by chaos serve and baked into the chaos image"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm build"

[tasks."ui:e2e"]
description = "Browser smoke of the deployed UI through Envoy (UI_BASE=http://localhost:18080/chaos); downloads Chromium once"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm e2e"

[tasks."ui:check"]
description = "ui/chaos: prettier, eslint, tsc"
depends = ["ui:install"]
dir = "ui/chaos"
run = """
pnpm format:check
pnpm lint
pnpm typecheck
"""

[tasks."chaos:check"]
description = "Parse and check every scenario without running it"
run = "cargo run -q -p tbd-chaos -- check scenarios/*.toml"

[tasks."chaos:run"]
description = "Run every scenario under scenarios/ (CHAOS_ARGS for extra flags, e.g. --json)"
env = { RUST_LOG = "warn,tbd_chaos=info,tbd_protocol::error=off,tower_http=off" }
run = "cargo run -q -p tbd-chaos -- run --dir scenarios $CHAOS_ARGS"

[tasks.doc]
run = "cargo doc --workspace --all-features --no-deps"

[tasks.deny]
description = "Advisories, licences, bans, sources"
run = "cargo deny check"

[tasks.typos]
run = "typos"

[tasks.unused]
description = "Unused dependencies (weekly, not per PR)"
run = "cargo shear"

[tasks.features]
description = "Every feature combination compiles"
run = "cargo hack check --each-feature --no-dev-deps --workspace"

[tasks.msrv]
run = "cargo hack check --rust-version --workspace --all-targets --ignore-private"

[tasks.ci]
description = "Everything CI runs, in order. Sequential on purpose: parallel cargo invocations only fight over the target dir."
run = [
  "mise run fmt:check",
  "mise run typos",
  "mise run deny",
  "mise run lint",
  "mise run test",
  "mise run doc",
  "mise run chaos:run",
  "mise run ui:check",
]

# ----------------------------------------------------------------- run ----

[tasks."run:engine"]
description = "Run the engine (gRPC on ENGINE_LISTEN_ADDR)"
run = "cargo run -p tbd-engine"

[tasks."run:protocol"]
description = "Run the protocol service (HTTP/WS/GraphQL/gRPC on PROTOCOL_LISTEN_ADDR)"
run = "cargo run -p tbd-protocol"

[tasks.dev]
description = "Both services in one terminal (parallel, output prefixed per service)"
depends = ["run:engine", "run:protocol"]

[tasks."watch:engine"]
description = "Engine with auto-reload on file change (bacon)"
run = "bacon engine"

[tasks."watch:protocol"]
description = "Protocol with auto-reload on file change (bacon)"
run = "bacon protocol"

# --------------------------------------------------------------- docker ----

[tasks."docker:build"]
description = "Build the engine, protocol and chaos images locally (the UI first, so chaos carries it)"
depends = ["ui:build"]
run = [
  "docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG .",
]

[tasks."docker:push"]
depends = ["docker:build"]
run = [
  "docker push $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG",
]

[tasks.up]
description = "Local stack via compose"
run = "docker compose up --build -d"

[tasks.down]
run = "docker compose down -v"

[tasks.logs]
run = "docker compose logs -f"

# ------------------------------------------------------------------ k8s ----

[tasks."k8s:render"]
description = "Render the kustomize overlay (KUBE_OVERLAY=dev|prod)"
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY"

[tasks."k8s:diff"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl diff -f -"

[tasks."k8s:apply"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl apply -f -"

# ---------------------------------------------------------- local cluster ----
# A k3d cluster on this machine with Envoy, both services and the observability
# stack. Host ports: 18080 edge, 15051 engine LB, 3000 Grafana, 9090 VictoriaMetrics,
# 14317 OTLP into the collector, 9428 VictoriaLogs UI, 4040 Pyroscope. PVCs live under K3D_STORAGE.

[tasks."local:up"]
description = "Create the k3d cluster if missing (k3s 1.34, 1 server + 2 agents, storage on the RAID, tracefs mounted for the eBPF profiler)"
run = """
if k3d cluster list -o json | grep -q '"name":"'"$K3D_CLUSTER"'"'; then
  echo "cluster $K3D_CLUSTER exists"
else
  mkdir -p "$K3D_STORAGE"
  k3d cluster create "$K3D_CLUSTER" --image rancher/k3s:v1.34.9-k3s1 --servers 1 --agents 2 \
    --volume "$K3D_STORAGE:/var/lib/rancher/k3s/storage@all" \
    --volume /sys/kernel/tracing:/sys/kernel/tracing@all --volume /sys/kernel/debug:/sys/kernel/debug@all \
    -p "3000:3000@loadbalancer" -p "9090:9090@loadbalancer" -p "18080:18080@loadbalancer" \
    -p "15051:15051@loadbalancer" -p "14317:14317@loadbalancer" -p "9428:9428@loadbalancer" -p "4040:4040@loadbalancer" \
    --k3s-arg "--disable=traefik@server:0" --wait
fi
kubectl config use-context "k3d-$K3D_CLUSTER"
"""

[tasks."local:build"]
description = "Build the UI, then the engine, protocol and chaos images, and import them into the cluster"
run = """
mise run ui:build
docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:dev .
k3d image import -m direct -c "$K3D_CLUSTER" $IMAGE_REGISTRY/tbd-engine:dev $IMAGE_REGISTRY/tbd-protocol:dev $IMAGE_REGISTRY/tbd-chaos:dev
"""

[tasks."local:deploy"]
description = "Apply observability + app to the local cluster and wait for rollouts"
run = """
kubectl apply -k devops/k8s/observability
kubectl apply -f devops/k8s/observability/local-services.yaml
kubectl apply -k devops/k8s/overlays/local
kubectl -n observability rollout status statefulset/victoria-metrics statefulset/victoria-logs statefulset/tempo --timeout=180s
kubectl -n observability rollout status statefulset/pyroscope deployment/otel-collector deployment/grafana --timeout=300s
kubectl -n tbd rollout status deployment/engine deployment/protocol deployment/envoy deployment/chaos --timeout=180s
mise run local:urls
"""

[tasks."local:restart"]
description = "Rebuild images, re-apply the app overlay (config changes included) and restart the app pods"
run = """
mise run local:build
kubectl apply -k devops/k8s/overlays/local
kubectl -n tbd rollout restart deployment/engine deployment/protocol deployment/chaos
kubectl -n tbd rollout status deployment/engine deployment/protocol deployment/chaos --timeout=180s
"""

[tasks."local:urls"]
run = """
echo "edge (REST/WS/GraphQL/gRPC)  http://localhost:18080"
echo "engine LB (gRPC)             http://localhost:15051"
echo "chaos API                    http://localhost:18080/api/chaos/overview"
echo "chaos UI                     http://localhost:18080/chaos/"
echo "grafana (admin/admin)        http://localhost:3000"
echo "victoria-metrics             http://localhost:9090"
echo "otlp into the collector      http://localhost:14317"
echo "victoria-logs UI             http://localhost:9428/select/vmui"
echo "pyroscope UI                 http://localhost:4040"
echo "validate:  chaos validate --protocol http://localhost:18080 --engine http://localhost:15051"
"""

[tasks."local:status"]
run = "kubectl get pods -A -o wide"

[tasks."local:traffic"]
description = "Send N rounds of validate traffic through Envoy so the dashboards have data (N=${TRAFFIC_ROUNDS:-30})"
run = """
rounds=${TRAFFIC_ROUNDS:-30}
for i in $(seq 1 "$rounds"); do
  cargo run -q -p tbd-chaos -- validate --protocol http://localhost:18080 --engine http://localhost:15051 > /dev/null || true
  printf '\r  round %s/%s' "$i" "$rounds"
done
echo; echo "done: $rounds rounds, $((rounds * 11)) checks through Envoy"
"""

[tasks."local:load"]
description = "Sustained load through Envoy for LOAD_SECONDS (default 60): tight REST and gRPC loops, 8 workers. Fills dashboards and profiles."
run = """
secs=${LOAD_SECONDS:-60}; end=$(( $(date +%s) + secs ))
rest() { while [ $(date +%s) -lt $end ]; do curl -s -o /dev/null -X POST http://localhost:18080/v1/evaluate -H 'content-type: application/json' -d '{"subject_id":"load","payload":"x"}'; done; }
grpc() { while [ $(date +%s) -lt $end ]; do grpcurl -plaintext -d '{"subject_id":"load","payload":"eA=="}' localhost:15051 tbd.engine.v1.EngineService/Evaluate > /dev/null 2>&1; done; }
gql()  { while [ $(date +%s) -lt $end ]; do curl -s -o /dev/null -X POST http://localhost:18080/graphql -H 'content-type: application/json' -d '{"query":"{ evaluate(subjectId:\\"load\\"){ stub } }"}'; done; }
for i in 1 2 3; do rest & done; for i in 1 2 3; do grpc & done; for i in 1 2; do gql & done
echo "loading for ${secs}s (8 workers) ..."; wait; echo "done"
"""

[tasks."edge:password"]
description = "Print a random password once and the OBS_PASSWORD_HASH line for devops/edge/.env"
run = '''
pw=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
hash=$(docker run --rm caddy:2 caddy hash-password --plaintext "$pw")
echo "password: $pw"
# docker compose expands $ in .env files; bcrypt hashes are full of them, so double each.
echo "OBS_PASSWORD_HASH=$(printf '%s' "$hash" | sed 's/\$/$$/g')"
'''

[tasks."edge:up"]
description = "Public TLS edge on the host: Caddy with Let's Encrypt for api/grafana/logs/profiles/metrics.<BASE_DOMAIN> (settings in devops/edge/.env)"
run = """
docker compose -f devops/edge/compose.yaml up -d
docker compose -f devops/edge/compose.yaml exec caddy caddy reload --config /etc/caddy/Caddyfile
docker compose -f devops/edge/compose.yaml logs --tail=20 caddy
"""

[tasks."edge:down"]
description = "Stop the public edge; certificates are kept in the caddy-data volume"
run = "docker compose -f devops/edge/compose.yaml down"

[tasks."edge:logs"]
description = "Follow the public edge's access and certificate logs"
run = "docker compose -f devops/edge/compose.yaml logs -f caddy"

[tasks."local:down"]
description = "Delete the local cluster (PVC data under K3D_STORAGE is kept)"
run = "k3d cluster delete $K3D_CLUSTER"

[tasks.k9s]
description = "k9s on the local cluster"
run = "k9s --context k3d-$K3D_CLUSTER"

[tasks."grafana:reload"]
description = "Push devops/grafana/** (dashboards, datasources) to the cluster; Grafana rolls in seconds"
run = """
kubectl apply -k devops/k8s/observability
kubectl -n observability rollout status deployment/grafana --timeout=120s
echo "http://localhost:3000/dashboards?tag=tbd"
"""

[tasks."envoy:validate"]
description = "Check devops/envoy/envoy.yaml with Envoy itself"
run = "docker run --rm -v $PWD/devops/envoy/envoy.yaml:/e.yaml:ro envoyproxy/envoy:v1.39.1 --mode validate -c /e.yaml"

# -------------------------------------------------------------- ansible ----

[tasks."ansible:deps"]
dir = "devops/ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks."ansible:bootstrap"]
description = "Prepare hosts (packages, docker, deploy user). ANSIBLE_INVENTORY=inventory/dev.yml|inventory/prod.yml"
dir = "devops/ansible"
run = "ansible-playbook -i $ANSIBLE_INVENTORY playbooks/bootstrap.yml"

[tasks."ansible:local"]
description = "Bring the local cluster up through Ansible (same steps as local:up/build/deploy)"
dir = "devops/ansible"
run = "ansible-playbook playbooks/local.yml"

[tasks."ansible:deploy"]
description = "Deploy IMAGE_TAG to the inventory hosts"
dir = "devops/ansible"
run = "ansible-playbook -i $ANSIBLE_INVENTORY playbooks/deploy.yml -e image_tag=$IMAGE_TAG -e image_org=$IMAGE_REGISTRY --ask-vault-pass"

[tasks.ship]
description = "Build, push, deploy: the whole path"
depends = ["ci", "docker:push", "ansible:deploy"]
