[tasks."ledger:secrets"]
description = "Create the ledger-db Secret in tbd once (random passwords; never on disk). Pass URLs for managed databases: mise run ledger:secrets postgres://... http://user:pw@clickhouse:8123"
usage = '''
arg "[postgres_url]" help="external Postgres URL; default is the in-cluster ledger-postgres"
arg "[clickhouse_url]" help="external ClickHouse HTTP URL with credentials; default is the in-cluster clickhouse"
'''
run = """
kubectl apply -f devops/k8s/base/namespace.yaml >/dev/null
if kubectl -n tbd get secret ledger-db >/dev/null 2>&1; then echo "ledger-db exists; leaving it"; exit 0; fi
pg=$(openssl rand -hex 16)
ch=$(openssl rand -hex 16)
pg_url="${usage_postgres_url:-postgres://ledger:$pg@ledger-postgres.tbd.svc:5432/ledger?sslmode=disable}"
ch_url="${usage_clickhouse_url:-http://ledger:$ch@clickhouse.tbd.svc:8123}"
kubectl -n tbd create secret generic ledger-db \
  --from-literal=postgres-password="$pg" \
  --from-literal=clickhouse-password="$ch" \
  --from-literal=database-url="$pg_url" \
  --from-literal=clickhouse-url="$ch_url"
echo "ledger-db created"
"""

[tasks."finance:secrets"]
description = "Create the finance Secrets in tbd: finance-db (the app database URL, derived from ledger-db) and, given the key file, finance-bank (Enable Banking application id + RSA key). Never on disk in the repo."
usage = '''
arg "[application_id]" help="Enable Banking application id (the JWT kid)"
arg "[private_key_path]" help="path to the application's PKCS#8 PEM, e.g. ~/.config/enablebanking/private.key"
arg "[postgres_url]" help="external app database URL; default derives from the ledger-db Secret's password on the in-cluster Postgres, database tbd"
'''
run = """
kubectl apply -f devops/k8s/base/namespace.yaml >/dev/null
if kubectl -n tbd get secret finance-db >/dev/null 2>&1; then
  echo "finance-db exists; leaving it"
else
  if [ -n "${usage_postgres_url:-}" ]; then
    url="$usage_postgres_url"
  else
    pw=$(kubectl -n tbd get secret ledger-db -o jsonpath='{.data.postgres-password}' | base64 -d)
    [ -n "$pw" ] || { echo "ledger-db Secret missing; run mise run ledger:secrets first" >&2; exit 1; }
    url="postgres://ledger:$pw@ledger-postgres.tbd.svc:5432/tbd?sslmode=disable"
  fi
  kubectl -n tbd create secret generic finance-db --from-literal=database-url="$url"
  echo "finance-db created"
fi
if [ -n "${usage_application_id:-}" ] && [ -n "${usage_private_key_path:-}" ]; then
  if kubectl -n tbd get secret finance-bank >/dev/null 2>&1; then
    echo "finance-bank exists; leaving it (delete it to rotate)"
  else
    grep -q "BEGIN PRIVATE KEY" "$usage_private_key_path" || { echo "$usage_private_key_path is not a PKCS#8 PEM (convert: openssl pkcs8 -topk8 -nocrypt)" >&2; exit 1; }
    kubectl -n tbd create secret generic finance-bank \
      --from-literal=application-id="$usage_application_id" \
      --from-file=private-key="$usage_private_key_path"
    echo "finance-bank created"
  fi
else
  echo "no application id / key given; finance-bank not created (the sync worker stays off)"
fi
"""

[tasks."finance:connector-secrets"]
description = "Create or update the finance-connectors Secret in tbd: the sealing key for stored connector credentials (kept when the Secret exists, so nothing is unlinked), the Google OAuth client for Gmail, and the send-only client when given (docs/finance/gmail.md)."
usage = '''
arg "[google_client_id]" help="Google OAuth client id (Web application), redirect https://finance.<domain>/connectors/callback"
arg "[google_client_secret]" help="its secret"
arg "[google_send_client_id]" help="the send-only client's id (a published project asking for gmail.send alone); optional"
arg "[google_send_client_secret]" help="its secret"
'''
run = """
kubectl apply -f devops/k8s/base/namespace.yaml >/dev/null
key=$(kubectl -n tbd get secret finance-connectors -o jsonpath='{.data.key}' 2>/dev/null | base64 -d)
if [ -n "$key" ]; then
  echo "finance-connectors exists; keeping its sealing key (every linked connector stays linked) and replacing the clients"
else
  key=$(openssl rand -base64 32)
fi
kubectl -n tbd create secret generic finance-connectors \
  --from-literal=key="$key" \
  --from-literal=google-client-id="${usage_google_client_id:-}" \
  --from-literal=google-client-secret="${usage_google_client_secret:-}" \
  --from-literal=google-send-client-id="${usage_google_send_client_id:-}" \
  --from-literal=google-send-client-secret="${usage_google_send_client_secret:-}" \
  --dry-run=client -o yaml | kubectl apply -f - >/dev/null
echo "finance-connectors written; roll the finance deployment to pick it up"
"""

