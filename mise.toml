# Developer experience entrypoint. `mise run` lists tasks; `make <task>` delegates here.
# Rust itself is managed by rustup via rust-toolchain.toml, not by mise, so plain
# `cargo` works for people who do not use mise.

[settings]
experimental = true

[settings.pipx]
uvx = true

[env]
_.file = [".env"]
RUST_LOG = "info,tbd=debug"
LOG_FORMAT = "text"
IMAGE_REGISTRY = "ghcr.io/0x19"
IMAGE_TAG = "dev"
KUBE_OVERLAY = "dev"
K3D_CLUSTER = "tbd"
K3D_STORAGE = "/mnt/raid0/tbd-k3d/storage"
ANSIBLE_INVENTORY = "inventory/dev.yml"

[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-hack" = "latest"
"cargo:cargo-shear" = "latest"
"cargo:bacon" = "latest"
buf = "latest"
typos = "latest"
"ubi:typst/typst" = "0.15.1"
kubectl = "latest"
kustomize = "latest"
k3d = "latest"
k9s = "latest"
helm = "latest"
grpcurl = "latest"
websocat = "latest"
uv = "latest"
"pipx:ansible-core" = "latest"
# ui/chaos (Next.js). node is pinned to the line the kit targets; pnpm is its package manager.
node = "24"
pnpm = "latest"
# /mobile (Flutter workspace). Pinned: a pub workspace needs Flutter >= 3.38, and every
# task runs flutter through mise so the machine and CI agree.
flutter = "3.47.5"

# ---------------------------------------------------------------- build ----

[tasks.setup]
description = "Install toolchain components and every tool above"
run = ["rustup show active-toolchain", "mise install"]

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.build]
description = "Debug build of both services"
run = "cargo build --workspace"

[tasks."build:release"]
description = "Release build of both services"
run = "cargo build --workspace --release"

[tasks.clean]
run = "cargo clean"

# ------------------------------------------------------------- quality ----

[tasks.fmt]
description = "Format Rust and proto sources"
run = ["cargo fmt --all", "buf format -w proto"]

[tasks."fmt:check"]
run = ["cargo fmt --all --check", "buf format -d --exit-code proto"]

[tasks.lint]
description = "Clippy with warnings as errors, plus proto lint"
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "buf lint proto",
]

[tasks.test]
description = "Unit + integration tests (nextest) and doctests. The ledger's store tests need Docker or LEDGER_TEST_DATABASE_URL / LEDGER_TEST_CLICKHOUSE_URL; with neither they are skipped with a warning (and fail under CI=1)"
# The progress bar writes carriage returns, which smear into one line when
# output goes through mise. The per-test list is what we want anyway.
env = { NEXTEST_HIDE_PROGRESS_BAR = "1" }
run = """
set -eu
filter=""
if [ -z "${LEDGER_TEST_DATABASE_URL:-}" ] || [ -z "${LEDGER_TEST_CLICKHOUSE_URL:-}" ]; then
  if docker info >/dev/null 2>&1; then
    # Pull once, so the first container start never counts against a test's timeout.
    for image in pgvector/pgvector:0.8.6-pg17-trixie clickhouse/clickhouse-server:26.8.2.7; do
      docker image inspect "$image" >/dev/null 2>&1 || docker pull -q "$image"
    done
  elif [ -n "${CI:-}" ]; then
    echo "CI without Docker and without LEDGER_TEST_*_URL: the ledger store tests cannot run" >&2
    exit 1
  else
    echo "warning: no Docker and no LEDGER_TEST_*_URL: skipping the ledger store tests (pg::, clickhouse::)" >&2
    filter="not (package(tbd-ledger) & (test(/^pg::/) | test(/^clickhouse::/)))"
  fi
fi
if [ -n "$filter" ]; then
  cargo nextest run --workspace --all-features -E "$filter"
else
  cargo nextest run --workspace --all-features
fi
cargo test --workspace --doc
"""

[tasks.validate]
description = "Hit every surface of a running stack (TBD_ENV=cluster for the k3d cluster; --target kind=url or CHAOS_<KIND>_URL to override)"
run = "cargo run -q -p tbd-chaos -- validate"

[tasks."chaos:docs"]
description = "Regenerate docs/chaos/kinds.md from the kind registry (chaos kinds --md)"
# The quoted heredoc keeps the backticks literal; an unquoted one runs them.
run = '''
{
  cat <<'HEADER'
# Service kinds

Generated by `mise run chaos:docs` from `crates/chaos/src/kinds/`; do not edit by hand:
`chaos:docs:check` in `mise run ci` fails when this file is stale. How a kind is
declared and what derives from it: [extending.md](extending.md#add-a-service-kind).

## Kinds and checks

HEADER
  cargo run -q -p tbd-chaos -- kinds --md
} > docs/chaos/kinds.md
'''

[tasks."chaos:docs:check"]
description = "Fail when docs/chaos/kinds.md is stale"
run = """
before=$(mktemp)
cp docs/chaos/kinds.md "$before"
mise run chaos:docs
if ! cmp -s "$before" docs/chaos/kinds.md; then
  echo "docs/chaos/kinds.md was stale: it has been regenerated, commit it"
  rm -f "$before"
  exit 1
fi
rm -f "$before"
"""

[tasks."chaos:up"]
description = "Run the dev topology (topologies/dev.toml) in one process until Ctrl-C"
run = "cargo run -q -p tbd-chaos -- up topologies/dev.toml"

[tasks."chaos:serve"]
description = "chaos API on :7700 with the dev topology in-process (TBD_ENV picks configs/chaos/<env>.toml); serves ui/chaos/out when built"
run = "cargo run -q -p tbd-chaos -- serve --ui-dir ui/chaos/out $CHAOS_ARGS"

[tasks."chaos:slack"]
description = "Give the chaos pod a Slack incoming webhook for run notifications: mise run chaos:slack https://hooks.slack.com/services/..."
usage = '''
arg "<url>" help="the Slack incoming webhook URL (https://hooks.slack.com/services/...)"
'''
run = """
set -euo pipefail
kubectl -n tbd create secret generic chaos-notify --from-literal=CHAOS_SLACK_WEBHOOK="$usage_url" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n tbd rollout restart deployment/chaos >/dev/null
echo "chaos-notify secret set; chaos restarted. Channel and outcomes: configs/chaos/<env>.toml [notify.slack]"
"""

[tasks."chaos:config"]
description = "Print the effective chaos config for TBD_ENV (base.toml + <env>.toml)"
run = "cargo run -q -p tbd-chaos -- config"

# ------------------------------------------------------------------- ui ----

[tasks."ui:install"]
description = "Install ui/chaos dependencies (pnpm, lockfile-exact)"
dir = "ui/chaos"
run = "pnpm install --frozen-lockfile"

[tasks."ui:dev"]
description = "ui/chaos dev server on :3001 against chaos serve on :7700 (NEXT_PUBLIC_CHAOS_API to override)"
dir = "ui/chaos"
run = "pnpm dev"

[tasks."ui:build"]
description = "Static export of ui/chaos into ui/chaos/out, served by chaos serve and baked into the chaos image"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm build"

[tasks."ui:e2e"]
description = "Browser smoke of the deployed UI through Envoy (UI_BASE=http://chaos.localhost:18080); downloads Chromium once"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm e2e"

[tasks."ui:check"]
description = "ui/chaos: prettier, eslint, tsc"
depends = ["ui:install"]
dir = "ui/chaos"
run = """
pnpm format:check
pnpm lint
pnpm typecheck
"""

[tasks."chaos:check"]
description = "Parse and check every scenario without running it"
run = "cargo run -q -p tbd-chaos -- check scenarios/*.toml"

[tasks."chaos:run"]
description = "Run every scenario under scenarios/ (CHAOS_ARGS for extra flags, e.g. --json)"
env = { RUST_LOG = "warn,tbd_chaos=info,tbd_protocol::error=off,tower_http=off" }
run = "cargo run -q -p tbd-chaos -- run --dir scenarios $CHAOS_ARGS"

[tasks."stress:check"]
description = "Parse and check every stress campaign without running it"
run = "cargo run -q -p tbd-chaos -- stress check stress/*.toml"

[tasks."stress:run"]
description = "Run every stress campaign under stress/ against in-process ledgers (STRESS_ARGS for extra flags, e.g. --json or --target ledger=URL)"
env = { RUST_LOG = "warn,tbd_chaos=info,tbd_stress=info,tbd_protocol::error=off,tower_http=off" }
run = "cargo run -q -p tbd-chaos -- stress run --dir stress $STRESS_ARGS"

[tasks.doc]
run = "cargo doc --workspace --all-features --no-deps"

[tasks.deny]
description = "Advisories, licences, bans, sources"
run = "cargo deny check"

[tasks.typos]
run = "typos"

[tasks.unused]
description = "Unused dependencies (weekly, not per PR)"
run = "cargo shear"

[tasks.features]
description = "Every feature combination compiles"
run = "cargo hack check --each-feature --no-dev-deps --workspace"

[tasks.msrv]
run = "cargo hack check --rust-version --workspace --all-targets --ignore-private"

[tasks.ci]
description = "Everything CI runs, in order. Sequential on purpose: parallel cargo invocations only fight over the target dir."
run = [
  "mise run fmt:check",
  "mise run typos",
  "mise run deny",
  "mise run lint",
  "mise run test",
  "mise run tbd:selfcheck",
  "mise run doc",
  "mise run chaos:docs:check",
  "mise run chaos:run",
  "mise run stress:run",
  "mise run ui:check",
  "mise run ui:auth:check",
  "mise run ui:www:check",
  "mise run ui:finances:check",
  "mise run ui:cv:check",
  "mise run mobile:check",
]

# ------------------------------------------------------------- scaffold ----

[tasks.tbd]
description = "The tbd CLI: mise run tbd -- new service <name> | service check <name> | service list (docs/tbd/README.md)"
run = "cargo run -q -p tbd-cli --"

[tasks."tbd:selfcheck"]
description = "Scaffold a throwaway service into a copy of the tree and prove it compiles, lints, tests and is fully registered"
run = """
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git ls-files -co --exclude-standard -z | tar --null -T - -cf - | tar -C "$tmp" -xf -
cargo run -q -p tbd-cli -- --repo "$tmp" new service zeta --port 50099 --metrics-port 9499 --bacon-key z
cargo run -q -p tbd-cli -- --repo "$tmp" new service zeta | grep -q "already scaffolded"
cargo run -q -p tbd-cli -- --repo "$tmp" service check zeta
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}"
cd "$tmp"
cargo check -q -p tbd-zeta --all-targets
cargo clippy -q -p tbd-zeta --all-targets -- -D warnings
cargo fmt --check -p tbd-zeta
cargo nextest run -p tbd-zeta
# The chaos side: the kind is registered, its docs row renders, the shipped
# scenarios still check, and the chaos tests (which build a stack of every
# registered kind) pass with zeta in it.
cargo fmt --check -p tbd-chaos
cargo clippy -q -p tbd-chaos --all-targets -- -D warnings
cargo run -q -p tbd-chaos -- kinds --md | grep -q '`zeta`'
cargo run -q -p tbd-chaos -- check scenarios/*.toml > /dev/null
cargo nextest run -p tbd-chaos
buf lint proto
"""

# ----------------------------------------------------------------- run ----

[tasks."run:engine"]
description = "Run the engine (gRPC on ENGINE_LISTEN_ADDR)"
run = "cargo run -p tbd-engine"

[tasks."run:protocol"]
description = "Run the protocol service (HTTP/WS/GraphQL/gRPC on PROTOCOL_LISTEN_ADDR; TBD_ENV picks configs/protocol/<env>.toml)"
run = "cargo run -p tbd-protocol"

[tasks."protocol:openapi"]
description = "Regenerate docs/protocol/openapi.json from the protocol's handlers (a test keeps the served document equal to it)"
run = "cargo run -q -p tbd-protocol -- openapi > docs/protocol/openapi.json"

[tasks."run:ledger"]
description = "Run the ledger service (gRPC on LEDGER_LISTEN_ADDR)"
run = "cargo run -p tbd-ledger"

[tasks."run:humans"]
description = "Run the humans service (gRPC on HUMANS_LISTEN_ADDR)"
run = "cargo run -p tbd-humans"

[tasks."run:finance"]
description = "Run the finance service (gRPC on FINANCE_LISTEN_ADDR)"
run = "cargo run -p tbd-finance"

[tasks."run:playground"]
description = "Run the playground service (gRPC on PLAYGROUND_LISTEN_ADDR)"
run = "cargo run -p tbd-playground"

[tasks."run:cv"]
description = "Run the cv service (gRPC on CV_LISTEN_ADDR)"
run = "cargo run -p tbd-cv"

[tasks.dev]
description = "Both services in one terminal (parallel, output prefixed per service)"
depends = ["run:engine", "run:protocol", "run:ledger", "run:humans", "run:finance", "run:playground", "run:cv"]

[tasks."watch:engine"]
description = "Engine with auto-reload on file change (bacon)"
run = "bacon engine"

[tasks."watch:protocol"]
description = "Protocol with auto-reload on file change (bacon)"
run = "bacon protocol"

[tasks."watch:ledger"]
description = "Ledger with auto-reload on file change (bacon)"
run = "bacon ledger"

[tasks."watch:humans"]
description = "Humans with auto-reload on file change (bacon)"
run = "bacon humans"

[tasks."watch:finance"]
description = "Finance with auto-reload on file change (bacon)"
run = "bacon finance"

[tasks."watch:playground"]
description = "Playground with auto-reload on file change (bacon)"
run = "bacon playground"

[tasks."watch:cv"]
description = "Cv with auto-reload on file change (bacon)"
run = "bacon cv"

# --------------------------------------------------------------- docker ----

[tasks."docker:build"]
description = "Build the engine, protocol and chaos images locally (the UI first, so chaos carries it)"
depends = ["ui:build"]
run = [
  "docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=cv --build-arg PORT=50056 -t $IMAGE_REGISTRY/tbd-cv:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=playground --build-arg PORT=50055 -t $IMAGE_REGISTRY/tbd-playground:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=finance --build-arg PORT=50054 -t $IMAGE_REGISTRY/tbd-finance:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=humans --build-arg PORT=50053 -t $IMAGE_REGISTRY/tbd-humans:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=ledger --build-arg PORT=50052 -t $IMAGE_REGISTRY/tbd-ledger:$IMAGE_TAG .",
]

[tasks."docker:push"]
depends = ["docker:build"]
run = [
  "docker push $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-cv:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-playground:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-finance:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-humans:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-ledger:$IMAGE_TAG",
]

[tasks.up]
description = "Local stack via compose"
run = "docker compose up --build -d"

[tasks.down]
run = "docker compose down -v"

[tasks.logs]
run = "docker compose logs -f"

# ------------------------------------------------------------------ k8s ----

[tasks."k8s:render"]
description = "Render the kustomize overlay (KUBE_OVERLAY=dev|prod)"
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY"

[tasks."k8s:diff"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl diff -f -"

[tasks."k8s:apply"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl apply -f -"

# ---------------------------------------------------------- local cluster ----
# A k3d cluster on this machine with Envoy, both services and the observability
# stack. Host ports: 18080 edge, 15051 engine LB, 3000 Grafana, 9090 VictoriaMetrics,
# 14317 OTLP into the collector, 9428 VictoriaLogs UI, 4040 Pyroscope. PVCs live under K3D_STORAGE.

[tasks."local:up"]
description = "Create the k3d cluster if missing (k3s 1.34, 1 server + 2 agents, storage on the RAID, tracefs mounted for the eBPF profiler)"
run = """
if k3d cluster list -o json | grep -q '"name":"'"$K3D_CLUSTER"'"'; then
  echo "cluster $K3D_CLUSTER exists"
else
  mkdir -p "$K3D_STORAGE"
  k3d cluster create "$K3D_CLUSTER" --image rancher/k3s:v1.34.9-k3s1 --servers 1 --agents 2 \
    --volume "$K3D_STORAGE:/var/lib/rancher/k3s/storage@all" \
    --volume /sys/kernel/tracing:/sys/kernel/tracing@all --volume /sys/kernel/debug:/sys/kernel/debug@all \
    -p "3000:3000@loadbalancer" -p "9090:9090@loadbalancer" -p "18080:18080@loadbalancer" \
    -p "15051:15051@loadbalancer" -p "14317:14317@loadbalancer" -p "9428:9428@loadbalancer" -p "4040:4040@loadbalancer" \
    --k3s-arg "--disable=traefik@server:0" --wait
fi
kubectl config use-context "k3d-$K3D_CLUSTER"
"""

[tasks."local:build"]
description = "Build the UI, then the engine, protocol and chaos images, and import them into the cluster"
run = """
mise run ui:build
docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=cv --build-arg PORT=50056 -t $IMAGE_REGISTRY/tbd-cv:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=playground --build-arg PORT=50055 -t $IMAGE_REGISTRY/tbd-playground:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=finance --build-arg PORT=50054 -t $IMAGE_REGISTRY/tbd-finance:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=humans --build-arg PORT=50053 -t $IMAGE_REGISTRY/tbd-humans:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=ledger --build-arg PORT=50052 -t $IMAGE_REGISTRY/tbd-ledger:dev .
docker build -f devops/docker/Dockerfile.auth-ui $(mise run -q auth:ui-build-args) -t $IMAGE_REGISTRY/tbd-auth-ui:dev .
docker build -f devops/docker/Dockerfile.www $(mise run -q www:build-args) -t $IMAGE_REGISTRY/tbd-www:dev .
docker build -f devops/docker/Dockerfile.finances -t $IMAGE_REGISTRY/tbd-finances-ui:dev .
docker build -f devops/docker/Dockerfile.cv-ui -t $IMAGE_REGISTRY/tbd-cv-ui:dev .
k3d image import -m direct -c "$K3D_CLUSTER" $IMAGE_REGISTRY/tbd-engine:dev $IMAGE_REGISTRY/tbd-protocol:dev $IMAGE_REGISTRY/tbd-chaos:dev $IMAGE_REGISTRY/tbd-cv:dev $IMAGE_REGISTRY/tbd-playground:dev $IMAGE_REGISTRY/tbd-finance:dev $IMAGE_REGISTRY/tbd-humans:dev $IMAGE_REGISTRY/tbd-ledger:dev $IMAGE_REGISTRY/tbd-auth-ui:dev $IMAGE_REGISTRY/tbd-www:dev $IMAGE_REGISTRY/tbd-finances-ui:dev $IMAGE_REGISTRY/tbd-cv-ui:dev
"""

# The chaos UI links to grafana.<domain>, logs.<domain>, ... of the public edge.
# Copy only BASE_DOMAIN out of devops/edge/.env into the local overlay; empty when
# no edge is configured, and the environment file's localhost links apply.
[tasks."local:edge-env"]
hide = true
run = """
domain="${BASE_DOMAIN:-$(grep -s '^BASE_DOMAIN=' devops/edge/.env | cut -d= -f2- | tr -d '"')}"
# The company site's own domain, when it has one (devops/edge/.env SITE_DOMAIN): the
# browser hosts under it need their login callbacks registered (seed-clients.sh).
site="${SITE_DOMAIN:-$(grep -s '^SITE_DOMAIN=' devops/edge/.env | cut -d= -f2- | tr -d '"')}"
auth_url="${domain:+https://auth.$domain}"; auth_url="${auth_url:-http://auth.localhost:18080}"
printf 'CHAOS_PUBLIC_DOMAIN=%s\nAUTH_PUBLIC_URL=%s\n' "$domain" "$auth_url" > devops/k8s/overlays/local/edge.env
echo "chaos UI links: ${domain:-localhost (no devops/edge/.env and BASE_DOMAIN unset)}"
# The identity stack's public URL: the edge when there is one, else the local host name.
if [ -n "$domain" ]; then
  printf 'AUTH_PUBLIC_URL=https://auth.%s\nBASE_DOMAIN=%s\nSITE_DOMAIN=%s\nAUTH_INSECURE_COOKIES=false\n' "$domain" "$domain" "$site" > devops/k8s/auth/auth.env
else
  printf 'AUTH_PUBLIC_URL=http://auth.localhost:18080\nBASE_DOMAIN=localhost\nSITE_DOMAIN=\nAUTH_INSECURE_COOKIES=true\n' > devops/k8s/auth/auth.env
fi
echo "auth: $(head -1 devops/k8s/auth/auth.env | cut -d= -f2)"
"""

[tasks."auth:ui-build-args"]
hide = true
run = """
# Recovery and verification pages exist only when an SMTP relay is configured (auth:smtp).
if kubectl -n auth get secret auth-secrets -o jsonpath='{.data.smtp-uri}' 2>/dev/null | grep -q .; then
  echo "--build-arg RECOVERY_ENABLED=true --build-arg VERIFICATION_ENABLED=true"
fi
"""

[tasks."ui:auth:dev"]
description = "Next.js dev server for the sign-in UI on :3002 (needs KRATOS_*/HYDRA_ADMIN_URL reachable; see ui/auth/README.md)"
depends = ["ui:auth:install"]
dir = "ui/auth"
run = "pnpm dev --port 3002"

[tasks."ui:auth:install"]
hide = true
dir = "ui/auth"
run = "pnpm install --frozen-lockfile"

[tasks."ui:auth:check"]
description = "ui/auth: prettier, eslint, tsc (same bar as ui/chaos)"
depends = ["ui:auth:install"]
dir = "ui/auth"
run = """
pnpm format:check
pnpm lint
pnpm typecheck
"""

[tasks."nda:pdf"]
description = "Render docs/nda/nda.{hr,en}.md to docs/nda/*.pdf with the finances UI's Playwright Chromium (docs/nda/README.md)"
depends = ["ui:finances:install"]
dir = "ui/finances"
run = "node ../../docs/nda/render.mjs"

[tasks."ui:auth:build"]
description = "Build the sign-in UI image (ghcr.io/0x19/tbd-auth-ui:dev)"
run = "docker build -f devops/docker/Dockerfile.auth-ui $(mise run -q auth:ui-build-args) -t $IMAGE_REGISTRY/tbd-auth-ui:dev ."

# ------------------------------------------------------------- mobile ----
# The Flutter workspace under /mobile (mobile/CLAUDE.md). Flutter is pinned in
# [tools]; every task runs it through mise so the version is the same everywhere.

[tasks."mobile:setup"]
description = "Fetch the workspace's Dart dependencies (pub workspace: one lock file)"
dir = "mobile"
run = "flutter pub get"

[tasks."mobile:env"]
usage = 'arg "[env]" help="local | prod (default local)"'
description = "Merge configs/mobile/base.json with configs/mobile/<env>.json into mobile/build/env.<env>.json: mise run mobile:env local"
dir = "mobile"
run = 'dart run tool/env.dart "${usage_env:-local}"'

[tasks."mobile:config"]
usage = 'arg "[env]" help="local | prod (default local)"'
description = "Print the effective mobile configuration for an environment, like `chaos config`: mise run mobile:config prod"
dir = "mobile"
run = 'dart run tool/env.dart "${usage_env:-local}" --print'

[tasks."mobile:gen"]
description = "Regenerate Dart from /proto (buf, remote Dart plugin), the theme tokens from the web kit's globals.css, and the app's l10n classes"
run = [
  "buf generate --template mobile/buf.gen.yaml proto",
  "cd mobile && dart run tool/theme.dart",
