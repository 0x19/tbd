# Developer experience entrypoint. `mise run` lists tasks; `make <task>` delegates here.
# Rust itself is managed by rustup via rust-toolchain.toml, not by mise, so plain
# `cargo` works for people who do not use mise.

[settings]
experimental = true

[settings.pipx]
uvx = true

[env]
_.file = [".env"]
RUST_LOG = "info,tbd=debug"
LOG_FORMAT = "text"
IMAGE_REGISTRY = "ghcr.io/0x19"
IMAGE_TAG = "dev"
KUBE_OVERLAY = "dev"
K3D_CLUSTER = "tbd"
K3D_STORAGE = "/mnt/raid0/tbd-k3d/storage"
ANSIBLE_INVENTORY = "inventory/dev.yml"

[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-hack" = "latest"
"cargo:cargo-shear" = "latest"
"cargo:bacon" = "latest"
buf = "latest"
typos = "latest"
kubectl = "latest"
kustomize = "latest"
k3d = "latest"
k9s = "latest"
helm = "latest"
grpcurl = "latest"
websocat = "latest"
uv = "latest"
"pipx:ansible-core" = "latest"
# ui/chaos (Next.js). node is pinned to the line the kit targets; pnpm is its package manager.
node = "24"
pnpm = "latest"

# ---------------------------------------------------------------- build ----

[tasks.setup]
description = "Install toolchain components and every tool above"
run = ["rustup show active-toolchain", "mise install"]

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-targets --all-features"

[tasks.build]
description = "Debug build of both services"
run = "cargo build --workspace"

[tasks."build:release"]
description = "Release build of both services"
run = "cargo build --workspace --release"

[tasks.clean]
run = "cargo clean"

# ------------------------------------------------------------- quality ----

[tasks.fmt]
description = "Format Rust and proto sources"
run = ["cargo fmt --all", "buf format -w proto"]

[tasks."fmt:check"]
run = ["cargo fmt --all --check", "buf format -d --exit-code proto"]

[tasks.lint]
description = "Clippy with warnings as errors, plus proto lint"
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "buf lint proto",
]

[tasks.test]
description = "Unit + integration tests (nextest) and doctests"
# The progress bar writes carriage returns, which smear into one line when
# output goes through mise. The per-test list is what we want anyway.
env = { NEXTEST_HIDE_PROGRESS_BAR = "1" }
run = [
  "cargo nextest run --workspace --all-features",
  "cargo test --workspace --doc",
]

[tasks.validate]
description = "Hit every surface of a running stack (TBD_ENV=cluster for the k3d cluster; --target kind=url or CHAOS_<KIND>_URL to override)"
run = "cargo run -q -p tbd-chaos -- validate"

[tasks."chaos:docs"]
description = "Regenerate docs/chaos/kinds.md from the kind registry (chaos kinds --md)"
# The quoted heredoc keeps the backticks literal; an unquoted one runs them.
run = '''
{
  cat <<'HEADER'
# Service kinds

Generated by `mise run chaos:docs` from `crates/chaos/src/kinds/`; do not edit by hand:
`chaos:docs:check` in `mise run ci` fails when this file is stale. How a kind is
declared and what derives from it: [extending.md](extending.md#add-a-service-kind).

## Kinds and checks

HEADER
  cargo run -q -p tbd-chaos -- kinds --md
} > docs/chaos/kinds.md
'''

[tasks."chaos:docs:check"]
description = "Fail when docs/chaos/kinds.md is stale"
run = """
before=$(mktemp)
cp docs/chaos/kinds.md "$before"
mise run chaos:docs
if ! cmp -s "$before" docs/chaos/kinds.md; then
  echo "docs/chaos/kinds.md was stale: it has been regenerated, commit it"
  rm -f "$before"
  exit 1
fi
rm -f "$before"
"""

[tasks."chaos:up"]
description = "Run the dev topology (topologies/dev.toml) in one process until Ctrl-C"
run = "cargo run -q -p tbd-chaos -- up topologies/dev.toml"

[tasks."chaos:serve"]
description = "chaos API on :7700 with the dev topology in-process (TBD_ENV picks configs/chaos/<env>.toml); serves ui/chaos/out when built"
run = "cargo run -q -p tbd-chaos -- serve --ui-dir ui/chaos/out $CHAOS_ARGS"

[tasks."chaos:slack"]
description = "Give the chaos pod a Slack incoming webhook for run notifications: mise run chaos:slack https://hooks.slack.com/services/..."
usage = '''
arg "<url>" help="the Slack incoming webhook URL (https://hooks.slack.com/services/...)"
'''
run = """
set -euo pipefail
kubectl -n tbd create secret generic chaos-notify --from-literal=CHAOS_SLACK_WEBHOOK="$usage_url" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n tbd rollout restart deployment/chaos >/dev/null
echo "chaos-notify secret set; chaos restarted. Channel and outcomes: configs/chaos/<env>.toml [notify.slack]"
"""

[tasks."chaos:config"]
description = "Print the effective chaos config for TBD_ENV (base.toml + <env>.toml)"
run = "cargo run -q -p tbd-chaos -- config"

# ------------------------------------------------------------------- ui ----

[tasks."ui:install"]
description = "Install ui/chaos dependencies (pnpm, lockfile-exact)"
dir = "ui/chaos"
run = "pnpm install --frozen-lockfile"

[tasks."ui:dev"]
description = "ui/chaos dev server on :3001 against chaos serve on :7700 (NEXT_PUBLIC_CHAOS_API to override)"
dir = "ui/chaos"
run = "pnpm dev"

[tasks."ui:build"]
description = "Static export of ui/chaos into ui/chaos/out, served by chaos serve and baked into the chaos image"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm build"

[tasks."ui:e2e"]
description = "Browser smoke of the deployed UI through Envoy (UI_BASE=http://chaos.localhost:18080); downloads Chromium once"
depends = ["ui:install"]
dir = "ui/chaos"
run = "pnpm e2e"

[tasks."ui:check"]
description = "ui/chaos: prettier, eslint, tsc"
depends = ["ui:install"]
dir = "ui/chaos"
run = """
pnpm format:check
pnpm lint
pnpm typecheck
"""

[tasks."chaos:check"]
description = "Parse and check every scenario without running it"
run = "cargo run -q -p tbd-chaos -- check scenarios/*.toml"

[tasks."chaos:run"]
description = "Run every scenario under scenarios/ (CHAOS_ARGS for extra flags, e.g. --json)"
env = { RUST_LOG = "warn,tbd_chaos=info,tbd_protocol::error=off,tower_http=off" }
run = "cargo run -q -p tbd-chaos -- run --dir scenarios $CHAOS_ARGS"

[tasks.doc]
run = "cargo doc --workspace --all-features --no-deps"

[tasks.deny]
description = "Advisories, licences, bans, sources"
run = "cargo deny check"

[tasks.typos]
run = "typos"

[tasks.unused]
description = "Unused dependencies (weekly, not per PR)"
run = "cargo shear"

[tasks.features]
description = "Every feature combination compiles"
run = "cargo hack check --each-feature --no-dev-deps --workspace"

[tasks.msrv]
run = "cargo hack check --rust-version --workspace --all-targets --ignore-private"

[tasks.ci]
description = "Everything CI runs, in order. Sequential on purpose: parallel cargo invocations only fight over the target dir."
run = [
  "mise run fmt:check",
  "mise run typos",
  "mise run deny",
  "mise run lint",
  "mise run test",
  "mise run tbd:selfcheck",
  "mise run doc",
  "mise run chaos:docs:check",
  "mise run chaos:run",
  "mise run ui:check",
  "mise run ui:auth:check",
]

# ------------------------------------------------------------- scaffold ----

[tasks.tbd]
description = "The tbd CLI: mise run tbd -- new service <name> | service check <name> | service list (docs/tbd/README.md)"
run = "cargo run -q -p tbd-cli --"

[tasks."tbd:selfcheck"]
description = "Scaffold a throwaway service into a copy of the tree and prove it compiles, lints, tests and is fully registered"
run = """
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git ls-files -co --exclude-standard -z | tar --null -T - -cf - | tar -C "$tmp" -xf -
cargo run -q -p tbd-cli -- --repo "$tmp" new service zeta --port 50099 --metrics-port 9499 --bacon-key z
cargo run -q -p tbd-cli -- --repo "$tmp" new service zeta | grep -q "already scaffolded"
cargo run -q -p tbd-cli -- --repo "$tmp" service check zeta
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}"
cd "$tmp"
cargo check -q -p tbd-zeta --all-targets
cargo clippy -q -p tbd-zeta --all-targets -- -D warnings
cargo fmt --check -p tbd-zeta
cargo nextest run -p tbd-zeta
# The chaos side: the kind is registered, its docs row renders, the shipped
# scenarios still check, and the chaos tests (which build a stack of every
# registered kind) pass with zeta in it.
cargo fmt --check -p tbd-chaos
cargo clippy -q -p tbd-chaos --all-targets -- -D warnings
cargo run -q -p tbd-chaos -- kinds --md | grep -q '`zeta`'
cargo run -q -p tbd-chaos -- check scenarios/*.toml > /dev/null
cargo nextest run -p tbd-chaos
buf lint proto
"""

# ----------------------------------------------------------------- run ----

[tasks."run:engine"]
description = "Run the engine (gRPC on ENGINE_LISTEN_ADDR)"
run = "cargo run -p tbd-engine"

[tasks."run:protocol"]
description = "Run the protocol service (HTTP/WS/GraphQL/gRPC on PROTOCOL_LISTEN_ADDR)"
run = "cargo run -p tbd-protocol"

[tasks."run:ledger"]
description = "Run the ledger service (gRPC on LEDGER_LISTEN_ADDR)"
run = "cargo run -p tbd-ledger"

[tasks."run:humans"]
description = "Run the humans service (gRPC on HUMANS_LISTEN_ADDR)"
run = "cargo run -p tbd-humans"

[tasks.dev]
description = "Both services in one terminal (parallel, output prefixed per service)"
depends = ["run:engine", "run:protocol", "run:ledger", "run:humans"]

[tasks."watch:engine"]
description = "Engine with auto-reload on file change (bacon)"
run = "bacon engine"

[tasks."watch:protocol"]
description = "Protocol with auto-reload on file change (bacon)"
run = "bacon protocol"

[tasks."watch:ledger"]
description = "Ledger with auto-reload on file change (bacon)"
run = "bacon ledger"

[tasks."watch:humans"]
description = "Humans with auto-reload on file change (bacon)"
run = "bacon humans"

# --------------------------------------------------------------- docker ----

[tasks."docker:build"]
description = "Build the engine, protocol and chaos images locally (the UI first, so chaos carries it)"
depends = ["ui:build"]
run = [
  "docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=humans --build-arg PORT=50053 -t $IMAGE_REGISTRY/tbd-humans:$IMAGE_TAG .",
  "docker build -f devops/docker/Dockerfile --build-arg BIN=ledger --build-arg PORT=50052 -t $IMAGE_REGISTRY/tbd-ledger:$IMAGE_TAG .",
]

[tasks."docker:push"]
depends = ["docker:build"]
run = [
  "docker push $IMAGE_REGISTRY/tbd-engine:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-protocol:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-chaos:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-humans:$IMAGE_TAG",
  "docker push $IMAGE_REGISTRY/tbd-ledger:$IMAGE_TAG",
]

[tasks.up]
description = "Local stack via compose"
run = "docker compose up --build -d"

[tasks.down]
run = "docker compose down -v"

[tasks.logs]
run = "docker compose logs -f"

# ------------------------------------------------------------------ k8s ----

[tasks."k8s:render"]
description = "Render the kustomize overlay (KUBE_OVERLAY=dev|prod)"
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY"

[tasks."k8s:diff"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl diff -f -"

[tasks."k8s:apply"]
run = "kustomize build devops/k8s/overlays/$KUBE_OVERLAY | kubectl apply -f -"

# ---------------------------------------------------------- local cluster ----
# A k3d cluster on this machine with Envoy, both services and the observability
# stack. Host ports: 18080 edge, 15051 engine LB, 3000 Grafana, 9090 VictoriaMetrics,
# 14317 OTLP into the collector, 9428 VictoriaLogs UI, 4040 Pyroscope. PVCs live under K3D_STORAGE.

[tasks."local:up"]
description = "Create the k3d cluster if missing (k3s 1.34, 1 server + 2 agents, storage on the RAID, tracefs mounted for the eBPF profiler)"
run = """
if k3d cluster list -o json | grep -q '"name":"'"$K3D_CLUSTER"'"'; then
  echo "cluster $K3D_CLUSTER exists"
else
  mkdir -p "$K3D_STORAGE"
  k3d cluster create "$K3D_CLUSTER" --image rancher/k3s:v1.34.9-k3s1 --servers 1 --agents 2 \
    --volume "$K3D_STORAGE:/var/lib/rancher/k3s/storage@all" \
    --volume /sys/kernel/tracing:/sys/kernel/tracing@all --volume /sys/kernel/debug:/sys/kernel/debug@all \
    -p "3000:3000@loadbalancer" -p "9090:9090@loadbalancer" -p "18080:18080@loadbalancer" \
    -p "15051:15051@loadbalancer" -p "14317:14317@loadbalancer" -p "9428:9428@loadbalancer" -p "4040:4040@loadbalancer" \
    --k3s-arg "--disable=traefik@server:0" --wait
fi
kubectl config use-context "k3d-$K3D_CLUSTER"
"""

[tasks."local:build"]
description = "Build the UI, then the engine, protocol and chaos images, and import them into the cluster"
run = """
mise run ui:build
docker build -f devops/docker/Dockerfile --build-arg BIN=engine   --build-arg PORT=50051 -t $IMAGE_REGISTRY/tbd-engine:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=protocol --build-arg PORT=8080  -t $IMAGE_REGISTRY/tbd-protocol:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=chaos    --build-arg PORT=7700  -t $IMAGE_REGISTRY/tbd-chaos:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=humans --build-arg PORT=50053 -t $IMAGE_REGISTRY/tbd-humans:dev .
docker build -f devops/docker/Dockerfile --build-arg BIN=ledger --build-arg PORT=50052 -t $IMAGE_REGISTRY/tbd-ledger:dev .
docker build -f devops/docker/Dockerfile.auth-ui $(mise run -q auth:ui-build-args) -t $IMAGE_REGISTRY/tbd-auth-ui:dev .
k3d image import -m direct -c "$K3D_CLUSTER" $IMAGE_REGISTRY/tbd-engine:dev $IMAGE_REGISTRY/tbd-protocol:dev $IMAGE_REGISTRY/tbd-chaos:dev $IMAGE_REGISTRY/tbd-humans:dev $IMAGE_REGISTRY/tbd-ledger:dev $IMAGE_REGISTRY/tbd-auth-ui:dev
"""

# The chaos UI links to grafana.<domain>, logs.<domain>, ... of the public edge.
# Copy only BASE_DOMAIN out of devops/edge/.env into the local overlay; empty when
# no edge is configured, and the environment file's localhost links apply.
[tasks."local:edge-env"]
hide = true
run = """
domain="${BASE_DOMAIN:-$(grep -s '^BASE_DOMAIN=' devops/edge/.env | cut -d= -f2- | tr -d '"')}"
auth_url="${domain:+https://auth.$domain}"; auth_url="${auth_url:-http://auth.localhost:18080}"
printf 'CHAOS_PUBLIC_DOMAIN=%s\nAUTH_PUBLIC_URL=%s\n' "$domain" "$auth_url" > devops/k8s/overlays/local/edge.env
echo "chaos UI links: ${domain:-localhost (no devops/edge/.env and BASE_DOMAIN unset)}"
# The identity stack's public URL: the edge when there is one, else the local host name.
if [ -n "$domain" ]; then
  printf 'AUTH_PUBLIC_URL=https://auth.%s\nBASE_DOMAIN=%s\nAUTH_INSECURE_COOKIES=false\n' "$domain" "$domain" > devops/k8s/auth/auth.env
else
  printf 'AUTH_PUBLIC_URL=http://auth.localhost:18080\nBASE_DOMAIN=localhost\nAUTH_INSECURE_COOKIES=true\n' > devops/k8s/auth/auth.env
fi
echo "auth: $(head -1 devops/k8s/auth/auth.env | cut -d= -f2)"
"""

[tasks."auth:ui-build-args"]
hide = true
run = """
# Recovery and verification pages exist only when an SMTP relay is configured (auth:smtp).
if kubectl -n auth get secret auth-secrets -o jsonpath='{.data.smtp-uri}' 2>/dev/null | grep -q .; then
  echo "--build-arg RECOVERY_ENABLED=true --build-arg VERIFICATION_ENABLED=true"
fi
"""

[tasks."ui:auth:dev"]
description = "Next.js dev server for the sign-in UI on :3002 (needs KRATOS_*/HYDRA_ADMIN_URL reachable; see ui/auth/README.md)"
depends = ["ui:auth:install"]
dir = "ui/auth"
run = "pnpm dev --port 3002"

[tasks."ui:auth:install"]
hide = true
dir = "ui/auth"
run = "pnpm install --frozen-lockfile"

[tasks."ui:auth:check"]
description = "ui/auth: prettier, eslint, tsc (same bar as ui/chaos)"
depends = ["ui:auth:install"]
dir = "ui/auth"
run = """
pnpm format:check
pnpm lint
pnpm typecheck
"""

[tasks."ui:auth:build"]
description = "Build the sign-in UI image (ghcr.io/0x19/tbd-auth-ui:dev)"
run = "docker build -f devops/docker/Dockerfile.auth-ui $(mise run -q auth:ui-build-args) -t $IMAGE_REGISTRY/tbd-auth-ui:dev ."

[tasks."auth:secrets"]
description = "Create the auth-secrets Secret in the cluster once (random values; never on disk)"
run = """
kubectl apply -f devops/k8s/auth/namespace.yaml >/dev/null
if kubectl -n auth get secret auth-secrets >/dev/null 2>&1; then echo "auth-secrets exists; leaving it"; exit 0; fi
pg=$(openssl rand -hex 16)
kubectl -n auth create secret generic auth-secrets \
  --from-literal=postgres-password="$pg" \
  --from-literal=hydra-dsn="postgres://auth:$pg@postgres.auth.svc:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4" \
  --from-literal=kratos-dsn="postgres://auth:$pg@postgres.auth.svc:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4" \
  --from-literal=hydra-system="$(openssl rand -hex 32)" \
  --from-literal=kratos-cookie="$(openssl rand -hex 32)" \
  --from-literal=kratos-cipher="$(openssl rand -hex 16)" \
  --from-literal=ui-cookie="$(openssl rand -hex 32)" \
  --from-literal=ui-csrf="$(openssl rand -hex 32)" \
  --from-literal=client-ui-secret="$(openssl rand -hex 24)" \
  --from-literal=client-chaos-secret="$(openssl rand -hex 24)"
echo "auth-secrets created"
"""

[tasks."auth:oidc"]
description = "Store social sign-in credentials and restart Kratos: mise run auth:oidc google <client-id> <client-secret> (also: github)"
usage = '''
arg "<provider>" help="google or github"
arg "<id>" help="OAuth client id from the provider's console"
arg "<secret>" help="OAuth client secret"
'''
run = '''
provider="$usage_provider"; id="$usage_id"; secret="$usage_secret"
case "$provider" in google|github) ;; *) echo "unknown provider $provider (google, github)"; exit 1;; esac
kubectl -n auth patch secret auth-secrets --type merge -p "$(printf '{"stringData":{"oidc-%s-id":"%s","oidc-%s-secret":"%s"}}' "$provider" "$id" "$provider" "$secret")"
kubectl -n auth rollout restart deployment/kratos
kubectl -n auth rollout status deployment/kratos --timeout=180s
kubectl -n auth logs deployment/kratos -c render-config | tail -1
'''

[tasks."auth:envoy-secrets"]
description = "Give Envoy and chaos their OAuth2 client secrets in the app namespace (from auth-secrets)"
run = """
ui=$(kubectl -n auth get secret auth-secrets -o jsonpath='{.data.client-ui-secret}' | base64 -d)
chaos=$(kubectl -n auth get secret auth-secrets -o jsonpath='{.data.client-chaos-secret}' | base64 -d)
hmac=$(kubectl -n tbd get secret envoy-oauth -o jsonpath='{.data.hmac}' 2>/dev/null | base64 -d || true)
hmac="${hmac:-$(openssl rand -hex 32)}"
sds() { printf 'resources:\n  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret\n    name: oauth-%s-secret\n    generic_secret:\n      secret: { inline_string: "%s" }\n' "$1" "$2"; }
kubectl apply -f devops/k8s/base/namespace.yaml >/dev/null 2>&1 || true
kubectl -n tbd create secret generic envoy-oauth --from-literal=hmac="$hmac" --from-literal=token.yaml="$(sds token "$ui")" --from-literal=hmac.yaml="$(sds hmac "$hmac")" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n tbd create secret generic chaos-auth --from-literal=CHAOS_AUTH_CLIENT_SECRET="$chaos" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
echo "envoy-oauth and chaos-auth secrets in tbd are current"
"""

[tasks."auth:smtp"]
description = "Configure the e-mail relay and turn recovery/verification on: mise run auth:smtp 'smtps://user:pass@host:465/' no-reply@example.com"
usage = '''
arg "<uri>" help="SMTP connection URI (smtps://user:pass@host:465/ or smtp://...:587/?disable_starttls=false)"
arg "<from>" help="From address"
'''
run = '''
kubectl -n auth patch secret auth-secrets --type merge -p "$(printf '{"stringData":{"smtp-uri":"%s","smtp-from":"%s"}}' "$usage_uri" "$usage_from")"
kubectl -n auth rollout restart deployment/kratos
kubectl -n auth rollout status deployment/kratos --timeout=180s
kubectl -n auth logs deployment/kratos -c render-config | grep '^flows:'
echo "Rebuild the sign-in UI so its pages offer recovery and verification: mise run ui:auth:build && k3d image import -m direct -c tbd ghcr.io/0x19/tbd-auth-ui:dev && kubectl -n auth rollout restart deployment/auth-ui"
'''

[tasks."auth:rotate"]
description = "Rotate a secret: mise run auth:rotate client-ui | client-chaos | hmac | hydra-system (see docs/auth/README.md)"
usage = '''
arg "<what>" help="client-ui, client-chaos, hmac or hydra-system"
'''
run = '''
what="$usage_what"
case "$what" in
  client-ui|client-chaos)
    kubectl -n auth patch secret auth-secrets --type merge -p "$(printf '{"stringData":{"%s-secret":"%s"}}' "$what" "$(openssl rand -hex 24)")"
    mise run auth:deploy            # re-seeds the client with the new secret
    mise run auth:envoy-secrets     # hands it to Envoy / the chaos pod
    kubectl -n tbd rollout restart deployment/envoy deployment/chaos
    echo "$what rotated; Envoy and chaos restarted with the new secret" ;;
  hmac)
    kubectl -n tbd delete secret envoy-oauth --ignore-not-found >/dev/null
    mise run auth:envoy-secrets
    kubectl -n tbd rollout restart deployment/envoy
    echo "cookie HMAC rotated; every browser session on the UI hosts signs in again" ;;
  hydra-system)
    old=$(kubectl -n auth get secret auth-secrets -o jsonpath='{.data.hydra-system}' | base64 -d)
    kubectl -n auth patch secret auth-secrets --type merge -p "$(printf '{"stringData":{"hydra-system":"%s,%s"}}' "$(openssl rand -hex 32)" "$old")"
    kubectl -n auth rollout restart deployment/hydra
    kubectl -n auth rollout status deployment/hydra --timeout=180s
    echo "hydra system secret rotated (new first, old kept for decryption); drop the old one from the list later" ;;
  *) echo "unknown: $what (client-ui, client-chaos, hmac, hydra-system)"; exit 1 ;;
esac
'''

[tasks."auth:role"]
description = "Set a person's role (admin|editor|viewer): mise run auth:role someone@example.com admin"
usage = '''
arg "<email>" help="the identity's e-mail"
arg "<role>" help="admin, editor or viewer"
'''
run = '''
case "$usage_role" in admin|editor|viewer) ;; *) echo "role must be admin, editor or viewer"; exit 1;; esac
kubectl -n auth run "auth-role-$(date +%s)" --rm -i --restart=Never --image=curlimages/curl:8.16.0 --quiet -- sh -s -- "$usage_email" "$usage_role" < devops/k8s/auth/role.sh
'''

[tasks."auth:deploy"]
description = "Apply the identity stack (Postgres, Hydra, Kratos, login UI, seeded clients) and wait for it"
depends = ["local:edge-env", "auth:secrets"]
run = """
kubectl -n auth delete job seed-clients --ignore-not-found >/dev/null
kubectl apply -k devops/k8s/auth
kubectl -n auth rollout status statefulset/postgres --timeout=180s
kubectl -n auth rollout status deployment/hydra deployment/kratos deployment/auth-ui --timeout=300s
kubectl -n auth wait --for=condition=complete job/seed-clients --timeout=180s
kubectl -n auth logs job/seed-clients | tail -3
"""

[tasks."auth:e2e"]
description = "Browser check of sign-up + authorization code (PKCE) + token exchange against auth.<domain> (AUTH_URL overrides)"
depends = ["ui:install"]
dir = "ui/chaos"
run = """
export AUTH_URL="${AUTH_URL:-$(grep -s '^AUTH_PUBLIC_URL=' ../../devops/k8s/auth/auth.env | cut -d= -f2-)}"
pnpm exec playwright install chromium >/dev/null
node e2e/auth.mjs
"""

[tasks."auth:token"]
description = "Print a client-credentials access token for the chaos client (AUTH_URL defaults to auth.env)"
run = """
url="${AUTH_URL:-$(grep -s '^AUTH_PUBLIC_URL=' devops/k8s/auth/auth.env | cut -d= -f2-)}"
secret=$(kubectl -n auth get secret auth-secrets -o jsonpath='{.data.client-chaos-secret}' | base64 -d)
curl -fsS -u "tbd-chaos:$secret" -d grant_type=client_credentials -d scope=tbd.api -d audience=tbd-api "$url/oauth2/token"
echo
"""

[tasks."local:deploy"]
description = "Apply observability + app to the local cluster and wait for rollouts"
depends = ["local:edge-env"]
run = """
kubectl apply -k devops/k8s/observability
kubectl apply -f devops/k8s/observability/local-services.yaml
mise run auth:deploy
mise run auth:envoy-secrets
kubectl apply -k devops/k8s/overlays/local
kubectl -n observability rollout status statefulset/victoria-metrics statefulset/victoria-logs statefulset/tempo --timeout=180s
kubectl -n observability rollout status statefulset/pyroscope deployment/otel-collector deployment/grafana --timeout=300s
kubectl -n tbd rollout status deployment/engine deployment/protocol deployment/envoy deployment/chaos deployment/humans deployment/ledger --timeout=180s
mise run local:urls
"""

[tasks."local:restart"]
description = "Rebuild images, re-apply the app overlay (config changes included) and restart the app pods"
depends = ["local:edge-env"]
run = """
mise run local:build
kubectl apply -k devops/k8s/overlays/local
kubectl -n tbd rollout restart deployment/engine deployment/protocol deployment/chaos deployment/ledger deployment/humans
kubectl -n tbd rollout status deployment/engine deployment/protocol deployment/chaos deployment/humans deployment/ledger --timeout=180s
"""

[tasks."local:urls"]
run = """
echo "edge (REST/WS/GraphQL/gRPC)  http://localhost:18080"
echo "engine LB (gRPC)             http://localhost:15051"
echo "chaos API                    http://localhost:18080/api/chaos/v1/overview"
echo "chaos UI                     http://chaos.localhost:18080/   (browsers resolve *.localhost themselves)"
echo "sign-in (Hydra/Kratos)       $(grep -s '^AUTH_PUBLIC_URL=' devops/k8s/auth/auth.env | cut -d= -f2-)/login   discovery: /.well-known/openid-configuration"
echo "grafana (admin/admin)        http://localhost:3000"
echo "victoria-metrics             http://localhost:9090"
echo "otlp into the collector      http://localhost:14317"
echo "victoria-logs UI             http://localhost:9428/select/vmui"
echo "pyroscope UI                 http://localhost:4040"
echo "validate:  TBD_ENV=cluster mise run validate   (configs/chaos/cluster.toml; needs a token: CHAOS_AUTH_CLIENT_SECRET from 'kubectl -n tbd get secret chaos-auth', or -- --token \"$(mise run auth:token | jq -r .access_token)\")"
"""

[tasks."local:status"]
run = "kubectl get pods -A -o wide"

[tasks."local:traffic"]
description = "Send N rounds of validate traffic through Envoy so the dashboards have data (N=${TRAFFIC_ROUNDS:-30})"
run = """
rounds=${TRAFFIC_ROUNDS:-30}
for i in $(seq 1 "$rounds"); do
  TBD_ENV=cluster cargo run -q -p tbd-chaos -- validate > /dev/null || true
  printf '\r  round %s/%s' "$i" "$rounds"
done
echo; echo "done: $rounds rounds of validate through Envoy"
"""

[tasks."local:load"]
description = "Sustained load through Envoy for LOAD_SECONDS (default 60): tight REST and gRPC loops, 8 workers. Fills dashboards and profiles."
run = """
secs=${LOAD_SECONDS:-60}; end=$(( $(date +%s) + secs ))
rest() { while [ $(date +%s) -lt $end ]; do curl -s -o /dev/null -X POST http://localhost:18080/v1/evaluate -H 'content-type: application/json' -d '{"subject_id":"load","payload":"x"}'; done; }
grpc() { while [ $(date +%s) -lt $end ]; do grpcurl -plaintext -d '{"subject_id":"load","payload":"eA=="}' localhost:15051 tbd.engine.v1.EngineService/Evaluate > /dev/null 2>&1; done; }
gql()  { while [ $(date +%s) -lt $end ]; do curl -s -o /dev/null -X POST http://localhost:18080/graphql -H 'content-type: application/json' -d '{"query":"{ evaluate(subjectId:\\"load\\"){ stub } }"}'; done; }
for i in 1 2 3; do rest & done; for i in 1 2 3; do grpc & done; for i in 1 2; do gql & done
echo "loading for ${secs}s (8 workers) ..."; wait; echo "done"
"""

[tasks."edge:up"]
description = "Public TLS edge on the host: Caddy with Let's Encrypt for api/grafana/logs/profiles/metrics.<BASE_DOMAIN> (settings in devops/edge/.env)"
run = """
docker compose -f devops/edge/compose.yaml up -d
docker compose -f devops/edge/compose.yaml exec caddy caddy reload --config /etc/caddy/Caddyfile
docker compose -f devops/edge/compose.yaml logs --tail=20 caddy
"""

[tasks."edge:down"]
description = "Stop the public edge; certificates are kept in the caddy-data volume"
run = "docker compose -f devops/edge/compose.yaml down"

[tasks."edge:logs"]
description = "Follow the public edge's access and certificate logs"
run = "docker compose -f devops/edge/compose.yaml logs -f caddy"

[tasks."local:down"]
description = "Delete the local cluster (PVC data under K3D_STORAGE is kept)"
run = "k3d cluster delete $K3D_CLUSTER"

[tasks.k9s]
description = "k9s on the local cluster"
run = "k9s --context k3d-$K3D_CLUSTER"

[tasks."grafana:reload"]
description = "Push devops/grafana/** (dashboards, datasources) to the cluster; Grafana rolls in seconds"
run = """
kubectl apply -k devops/k8s/observability
kubectl -n observability rollout status deployment/grafana --timeout=120s
echo "http://localhost:3000/dashboards?tag=tbd"
"""

[tasks."envoy:validate"]
description = "Check devops/envoy/envoy.yaml with Envoy itself (placeholder auth URL and OAuth secrets substituted)"
run = """
d=$(mktemp -d); mkdir -p "$d/secrets"
sed 's|__AUTH_PUBLIC_URL__|http://auth.localhost:18080|g' devops/envoy/envoy.yaml > "$d/envoy.yaml"
for n in token hmac; do printf 'resources:\n  - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret\n    name: oauth-%s-secret\n    generic_secret:\n      secret: { inline_string: "placeholder" }\n' "$n" > "$d/secrets/$n.yaml"; done
docker run --rm -v "$d/envoy.yaml:/e.yaml:ro" -v "$d/secrets:/etc/envoy/secrets:ro" envoyproxy/envoy:v1.39.1 --mode validate -c /e.yaml
rm -rf "$d"
"""

# -------------------------------------------------------------- ansible ----

[tasks."ansible:deps"]
dir = "devops/ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks."ansible:bootstrap"]
description = "Prepare hosts (packages, docker, deploy user). ANSIBLE_INVENTORY=inventory/dev.yml|inventory/prod.yml"
dir = "devops/ansible"
run = "ansible-playbook -i $ANSIBLE_INVENTORY playbooks/bootstrap.yml"

[tasks."ansible:local"]
description = "Bring the local cluster up through Ansible (same steps as local:up/build/deploy)"
dir = "devops/ansible"
run = "ansible-playbook playbooks/local.yml"

[tasks."ansible:deploy"]
description = "Deploy IMAGE_TAG to the inventory hosts"
dir = "devops/ansible"
run = "ansible-playbook -i $ANSIBLE_INVENTORY playbooks/deploy.yml -e image_tag=$IMAGE_TAG -e image_org=$IMAGE_REGISTRY --ask-vault-pass"

[tasks.ship]
description = "Build, push, deploy: the whole path"
depends = ["ci", "docker:push", "ansible:deploy"]
