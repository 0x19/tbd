# Envoy: the only thing clients and services talk to.
#
# Listeners
#   :8080  edge       HTTP/1.1 + h2c. gRPC by service name, WebSocket upgrade,
#                     REST, SSE, GraphQL. Streams get no timeout.
#   :50051 engine-lb  gRPC only. Every protocol backend URL points here: routed by
#                     service name (engine is the catch-all), health probes by the
#                     x-tbd-backend header, so service replicas are a pure scale-out.
#   :9901  admin      /ready, /stats/prometheus, /clusters, /config_dump.
#
# Clusters resolve by DNS name: `engine`, `protocol`, `humans`, `ledger`, `chaos`, `otel-collector`,
# `hydra`, `kratos`, `auth-ui`, `grafana`, `victoria-logs`, `pyroscope`,
# `victoria-metrics`.
#
# Authentication happens here and nowhere else (docs/auth/README.md):
#   - API hosts (`api.<domain>`, the catch-all): every route except health needs a
#     bearer JWT from Hydra (audience tbd-api), verified against Hydra's JWKS.
#   - UI hosts (`grafana.`, `logs.`, `profiles.`, `metrics.`, `chaosadmin.`): the
#     oauth2 filter logs the browser in through Hydra and stores an ID token cookie,
#     which the same JWT filter verifies (audience tbd-ui). A bearer token passes
#     straight through, so scripts work on those hosts too.
#   - `auth.<domain>` and the local `chaos.*` host are open.
# One value is environment-specific: the browser-facing authorization URL. The
# file carries __AUTH_PUBLIC_URL__; the Envoy pod's init container and the compose
# service substitute it (devops/k8s/base/envoy, compose.yaml). Envoy validation
# substitutes a placeholder too (`mise run envoy:validate`).
# In compose those are service names; in Kubernetes they are headless Services
# (engine, protocol, chaos) and an ExternalName Service (otel-collector), so this
# one file is used unchanged everywhere. STRICT_DNS re-resolves every 5 s, so
# scale-out and pod churn are picked up without a restart.
#
# chaos: the API is reachable by prefix on any host (`/api/chaos/...`, versioned
# below it: `/api/chaos/v1/...`) and on
# its own host `chaos.api.<domain>` (rewritten to the prefix); the admin UI is
# served at the root of the `chaos.<domain>` / `chaosadmin.<domain>` hosts
# (`chaos.localhost` locally: browsers resolve *.localhost to loopback). Where chaos is not deployed the cluster has no endpoints
# and Envoy answers 503, which is the intended "not here".
#
# Observability: JSON access logs to stdout with the trace id, Prometheus stats on
# the admin port, OpenTelemetry tracing to the collector with W3C traceparent
# propagation, so an Envoy span is the root of every trace.

# Required by the file-based SDS that feeds the OAuth2 filter its secrets; the
# compose service's --service-node/--service-cluster flags override it.
node:
  id: envoy
  cluster: envoy

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

layered_runtime:
  layers:
    - name: static
      static_layer:
        # Keep connections to busy upstreams bounded; raise with traffic.
        envoy.resource_limits.listener.edge.connection_limit: 100000

static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: AUTO
                generate_request_id: true
                use_remote_address: true
                # One trusted proxy in front (the TLS edge, devops/edge): its
                # X-Forwarded-For / X-Forwarded-Proto are kept, so the OAuth2 filter
                # builds https:// redirect URIs and access logs show the real client.
                xff_num_trusted_hops: 1
                # Long-lived streams (SSE, gRPC, WebSocket) must not be idled out
                # by the connection manager; per-route timeouts handle unary calls.
                stream_idle_timeout: 0s
                request_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: envoy
                      grpc_service:
                        envoy_grpc: { cluster_name: otel-collector }
                        timeout: 0.25s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format: &access_log_json
                          timestamp: "%START_TIME%"
                          level: "INFO"
                          message: "access"
                          listener: "%DOWNSTREAM_LOCAL_ADDRESS%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          status: "%RESPONSE_CODE%"
                          grpc_status: "%GRPC_STATUS_NUMBER%"
                          flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_ms: "%RESPONSE_DURATION%"
                          bytes_in: "%BYTES_RECEIVED%"
                          bytes_out: "%BYTES_SENT%"
                          upstream: "%UPSTREAM_HOST%"
                          cluster: "%UPSTREAM_CLUSTER%"
                          client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          traceparent: "%REQ(TRACEPARENT)%"
                          trace_id: "%TRACE_ID%"
                          user_agent: "%REQ(USER-AGENT)%"
                http_filters:
                  # Identity headers are set by the JWT filter below and by nothing
                  # else: whatever a client sends in them is dropped first.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-jwt-payload
                          - remove: x-user-sub
                          - remove: x-user-email
                          - remove: x-user-name
                          - remove: x-webauth-user
                          - remove: x-webauth-name
                          - remove: x-webauth-role
                  # Browser login for the UI hosts. Only routes that opt in with
                  # per-route config use it; everything else has it disabled.
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        token_endpoint:
                          cluster: hydra
                          uri: http://hydra:4444/oauth2/token
                          timeout: 5s
                        authorization_endpoint: __AUTH_PUBLIC_URL__/oauth2/auth
                        redirect_uri: "%REQ(x-forwarded-proto)%://%REQ(:authority)%/oauth2/callback"
                        redirect_path_matcher:
                          path: { exact: /oauth2/callback }
                        signout_path:
                          path: { exact: /oauth2/signout }
                        credentials:
                          client_id: tbd-ui
                          token_secret:
                            name: oauth-token-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/secrets/token.yaml }
                          hmac_secret:
                            name: oauth-hmac-secret
                            sds_config:
                              path_config_source: { path: /etc/envoy/secrets/hmac.yaml }
                          cookie_names:
                            bearer_token: tbd_access
                            oauth_hmac: tbd_hmac
                            oauth_expires: tbd_expires
                            id_token: tbd_id
                            refresh_token: tbd_refresh
                        auth_scopes: [openid, offline_access, email, profile]
                        use_refresh_token: true
                        forward_bearer_token: false
                        # A browser's own API calls never get the sign-in redirect: a
                        # fetch cannot follow it (auth.<domain> is another origin), so
                        # it failed silently. They still get the token refresh; when
                        # that fails they get 401 and the UI reloads the page, which
                        # is a document navigation and takes the redirect.
                        deny_redirect_matcher:
                          - name: ":path"
                            string_match: { prefix: "/api/" }
                        # Scripts with their own bearer token skip the browser login.
                        pass_through_matcher:
                          - name: authorization
                            string_match: { prefix: "Bearer " }
                  # Verifies JWTs from Hydra: bearer tokens on the API (audience
                  # tbd-api), the ID-token cookie on the UI hosts (audience tbd-ui).
                  # Routes name the requirement they need; unnamed routes are open.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        api-bearer:
                          audiences: [tbd-api]
                          from_headers:
                            - name: authorization
                              value_prefix: "Bearer "
                          forward: true
                          forward_payload_header: x-jwt-payload
                          payload_in_metadata: jwt
                          claim_to_headers:
                            - { header_name: x-user-sub, claim_name: sub }
                          remote_jwks: &hydra_jwks
                            http_uri:
                              uri: http://hydra:4444/.well-known/jwks.json
                              cluster: hydra
                              timeout: 5s
                            cache_duration: 600s
                            async_fetch: { fast_listener: true }
                            retry_policy:
                              num_retries: 3
                        ui-cookie:
                          audiences: [tbd-ui]
                          from_cookies: [tbd_id]
                          payload_in_metadata: jwt
                          claim_to_headers:
                            - { header_name: x-user-sub, claim_name: sub }
                            - { header_name: x-user-email, claim_name: email }
                            - { header_name: x-user-name, claim_name: name }
                            - { header_name: x-user-role, claim_name: role }
                            - { header_name: x-user-grafana-role, claim_name: grafana_role }
                          remote_jwks: *hydra_jwks
                        ui-bearer:
                          audiences: [tbd-ui, tbd-api]
                          from_headers:
                            - name: authorization
                              value_prefix: "Bearer "
                          payload_in_metadata: jwt
                          claim_to_headers:
                            - { header_name: x-user-sub, claim_name: sub }
                            - { header_name: x-user-email, claim_name: email }
                            - { header_name: x-user-role, claim_name: role }
                            - { header_name: x-user-grafana-role, claim_name: grafana_role }
                          remote_jwks: *hydra_jwks
                      requirement_map:
                        api:
                          provider_name: api-bearer
                        ui:
                          requires_any:
                            requirements:
                              - provider_name: ui-cookie
                              - provider_name: ui-bearer
                  # Authorization on the verified claims. Disabled by default; routes
                  # that need a scope or a role carry their own policy below.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  # Rate limits, per route: token buckets keyed by the caller
                  # (subject for the API, client address for sign-in endpoints).
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: edge_ratelimit
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: edge
                  virtual_hosts:
                    # auth.<domain>: the identity stack on one host. Hydra's OAuth2/OIDC
                    # endpoints and Kratos' self-service API by path, the login /
                    # registration / consent pages for everything else. No auth filter:
                    # this is where people come to sign in.
                    - name: auth
                      domains: ["auth.*"]
                      typed_per_filter_config: &ui_open
                        envoy.filters.http.oauth2:
                          "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                          disabled: true
                      routes:
                        # Credential endpoints: 20 attempts per 10 s per client address
                        # (each address gets its own bucket; the fill is the burst).
                        - match: { prefix: "/self-service/login" }
                          typed_per_filter_config: &signin_ratelimit
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: signin_ratelimit
                              token_bucket: { max_tokens: 20, tokens_per_fill: 20, fill_interval: 10s }
                              filter_enabled: { default_value: { numerator: 100 }, runtime_key: signin_ratelimit_enabled }
                              filter_enforced: { default_value: { numerator: 100 }, runtime_key: signin_ratelimit_enforced }
                              status: { code: TooManyRequests }
                              rate_limited_as_resource_exhausted: true
                              local_rate_limit_per_downstream_connection: false
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/self-service/registration" }
                          typed_per_filter_config: *signin_ratelimit
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/self-service/recovery" }
                          typed_per_filter_config: *signin_ratelimit
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/oauth2/token" }
                          typed_per_filter_config: *signin_ratelimit
                          route: { cluster: hydra, timeout: 15s }
                        - match: { prefix: "/oauth2/" }
                          route: { cluster: hydra, timeout: 15s }
                        - match: { prefix: "/userinfo" }
                          route: { cluster: hydra, timeout: 15s }
                        - match: { path: "/.well-known/jwks.json" }
                          route: { cluster: hydra, timeout: 15s }
                        - match: { path: "/.well-known/openid-configuration" }
                          route: { cluster: hydra, timeout: 15s }
                        - match: { path: "/.well-known/oauth-authorization-server" }
                          route: { cluster: hydra, timeout: 15s }
                        - match: { prefix: "/self-service/" }
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/sessions/" }
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/schemas/" }
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/.well-known/ory/" }
                          route: { cluster: kratos, timeout: 15s }
                        - match: { prefix: "/" }
                          route: { cluster: auth-ui, timeout: 15s }
                    # chaos API on its own host: chaos.api.<domain>/... -> /api/chaos/...
                    - name: chaos-api
                      domains: ["chaos.api.*"]
                      typed_per_filter_config: &api_gated
                        envoy.filters.http.oauth2:
                          "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                          disabled: true
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: api
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: chaos
                            prefix_rewrite: "/api/chaos/"
                            timeout: 0s
                    # chaos UI on its own host, served at the root; the UI calls the
                    # API at /api/chaos/v1 on the same host. No rewrite: the static export
                    # links its assets by absolute path. `chaos.*` is the open local
                    # name (chaos.localhost); `chaosadmin.*` is the public one, behind
                    # the browser login.
                    - name: chaos-ui-local
                      domains: ["chaos.*"]
                      typed_per_filter_config: *ui_open
                      routes:
                        - match: { prefix: "/api/chaos/" }
                          route:
                            cluster: chaos
                            timeout: 0s
                        - match: { prefix: "/" }
                          route:
                            cluster: chaos
                            timeout: 15s
                    - name: chaos-ui
                      domains: ["chaosadmin.*"]
                      typed_per_filter_config: &ui_gated
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: ui
                        # The chaos tool stops instances and starts load: admins only
                        # (role from the ID token, or a machine token with scope tbd.api).
                        envoy.filters.http.rbac:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                          rbac:
                            rules:
                              action: ALLOW
                              policies:
                                admins:
                                  permissions: [{ any: true }]
                                  principals:
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt }, { key: role }]
                                        value: { string_match: { exact: admin } }
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt }, { key: scp }]
                                        value: { list_match: { one_of: { string_match: { exact: tbd.api } } } }
                      routes:
                        - match: { prefix: "/api/chaos/" }
                          route:
                            cluster: chaos
                            timeout: 0s
                        - match: { prefix: "/" }
                          route:
                            cluster: chaos
                            timeout: 15s
                    # Observability UIs, one host each, behind the browser login. Grafana
                    # trusts the identity headers (auth proxy) and creates the user.
                    - name: grafana
                      domains: ["grafana.*"]
                      typed_per_filter_config: &observability_gated
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: ui
                        # Any role may look at observability; the role reaches Grafana as
                        # X-WEBAUTH-ROLE (Admin, Editor or Viewer).
                        envoy.filters.http.rbac:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                          rbac:
                            rules:
                              action: ALLOW
                              policies:
                                anyone-with-a-role:
                                  permissions: [{ any: true }]
                                  principals:
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt }, { key: role }]
                                        value: { string_match: { safe_regex: { regex: "^(admin|editor|viewer)$" } } }
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt }, { key: scp }]
                                        value: { list_match: { one_of: { string_match: { exact: tbd.api } } } }
                      request_headers_to_add:
                        - header: { key: X-WEBAUTH-USER, value: "%REQ(x-user-email)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - header: { key: X-WEBAUTH-NAME, value: "%REQ(x-user-name)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - header: { key: X-WEBAUTH-ROLE, value: "%REQ(x-user-grafana-role)%" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: grafana
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                    - name: logs
                      domains: ["logs.*"]
                      typed_per_filter_config: *observability_gated
                      routes:
                        - match: { path: "/" }
                          redirect: { path_redirect: /select/vmui/ }
                        - match: { prefix: "/" }
                          route:
                            cluster: victoria-logs
                            timeout: 0s
                    - name: profiles
                      domains: ["profiles.*"]
                      typed_per_filter_config: *observability_gated
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: pyroscope
                            timeout: 0s
                    - name: metrics
                      domains: ["metrics.*"]
                      typed_per_filter_config: *observability_gated
                      routes:
                        - match: { path: "/" }
                          redirect: { path_redirect: /vmui/ }
                        - match: { prefix: "/" }
                          route:
                            cluster: victoria-metrics
                            timeout: 0s
                    # The API: api.<domain> publicly, localhost:18080 locally. Every
                    # route needs a bearer token except the health endpoints, which
                    # probes, Envoy's own health checks and uptime monitors call.
                    - name: all
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.oauth2:
                          "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                          disabled: true
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: api
                        # Scope tbd.api is what makes a token an API token.
                        envoy.filters.http.rbac:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                          rbac:
                            rules:
                              action: ALLOW
                              policies:
                                api-scope:
                                  permissions: [{ any: true }]
                                  principals:
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt }, { key: scp }]
                                        value: { list_match: { one_of: { string_match: { exact: tbd.api } } } }
                        # 1000 requests per second per subject, bursts of 2000; load
                        # tests run as one subject and stay under it.
                        envoy.filters.http.local_ratelimit:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: api_ratelimit
                          token_bucket: { max_tokens: 2000, tokens_per_fill: 1000, fill_interval: 1s }
                          filter_enabled: { default_value: { numerator: 100 }, runtime_key: api_ratelimit_enabled }
                          filter_enforced: { default_value: { numerator: 100 }, runtime_key: api_ratelimit_enforced }
                          status: { code: TooManyRequests }
                          rate_limited_as_resource_exhausted: true
                          local_rate_limit_per_downstream_connection: false
                          descriptors:
                            - entries: [{ key: subject }]
                              token_bucket: { max_tokens: 2000, tokens_per_fill: 1000, fill_interval: 1s }
                      rate_limits:
                        - actions:
                            - request_headers: { header_name: x-user-sub, descriptor_key: subject }
                      routes:
                        - match: { path: "/healthz" }
                          typed_per_filter_config: &open
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.rbac:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                              disabled: true
                          route:
                            cluster: protocol
                            timeout: 5s
                        - match: { path: "/readyz" }
                          typed_per_filter_config: *open
                          route:
                            cluster: protocol
                            timeout: 5s
                        - match: { path: "/api/chaos/v1/healthz" }
                          typed_per_filter_config: *open
                          route:
                            cluster: chaos
                            timeout: 5s
                        # chaos API by prefix. Streams (SSE) get no timeout.
                        - match: { prefix: "/api/chaos/" }
                          route:
                            cluster: chaos
                            timeout: 0s
                        - match: { path: "/api/chaos" }
                          route:
                            cluster: chaos
                            timeout: 0s
                        # gRPC: engine service straight to the engines.
                        - match: { prefix: "/tbd.engine.v1.EngineService/", grpc: {} }
                          route:
                            cluster: engine
                            timeout: 0s
                            retry_policy: &grpc_retry
                              retry_on: "connect-failure,refused-stream,unavailable"
                              num_retries: 2
                              per_try_timeout: 5s
                        # gRPC owned by the protocol: its own service, health, reflection.
                        - match: { prefix: "/", grpc: {} }
                          route:
                            cluster: protocol
                            timeout: 0s
                            retry_policy: *grpc_retry
                        # WebSocket bridge.
                        - match: { path: "/ws" }
                          route:
                            cluster: protocol
                            timeout: 0s
                            idle_timeout: 0s
                        # Server-sent events.
                        - match: { prefix: "/v1/subjects/" }
                          route:
                            cluster: protocol
                            timeout: 0s
                        # Everything else: REST, GraphQL, health.
                        - match: { prefix: "/" }
                          route:
                            cluster: protocol
                            timeout: 15s
                            retry_policy:
                              # Only failures where the request was never sent.
                              retry_on: "connect-failure,refused-stream"
                              num_retries: 2

    - name: engine-lb
      address:
        socket_address: { address: 0.0.0.0, port_value: 50051 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: engine_lb
                codec_type: HTTP2
                generate_request_id: true
                stream_idle_timeout: 0s
                request_timeout: 0s
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: envoy
                      grpc_service:
                        envoy_grpc: { cluster_name: otel-collector }
                        timeout: 0.25s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format: *access_log_json
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: engine-lb
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        # ledger, matched by service name; the engine stays the catch-all.
                        - match: { prefix: "/tbd.ledger.v1.LedgerService/", grpc: {} }
                          route:
                            cluster: ledger
                            timeout: 0s
                            retry_policy: *grpc_retry
                        # ledger health: the grpc.health.v1 path is shared, so the protocol
                        # names the backend it is asking about in x-tbd-backend.
                        - match: { prefix: "/grpc.health.v1.Health/", grpc: {}, headers: [{ name: x-tbd-backend, string_match: { exact: ledger } }] }
                          route:
                            cluster: ledger
                            timeout: 0s
                            retry_policy: *grpc_retry
                        # humans, matched by service name; the engine stays the catch-all.
                        - match: { prefix: "/tbd.humans.v1.HumansService/", grpc: {} }
                          route:
                            cluster: humans
                            timeout: 0s
                            retry_policy: *grpc_retry
                        # humans health: the grpc.health.v1 path is shared, so the protocol
                        # names the backend it is asking about in x-tbd-backend.
                        - match: { prefix: "/grpc.health.v1.Health/", grpc: {}, headers: [{ name: x-tbd-backend, string_match: { exact: humans } }] }
                          route:
                            cluster: humans
                            timeout: 0s
                            retry_policy: *grpc_retry
                        - match: { prefix: "/" }
                          route:
                            cluster: engine
                            timeout: 0s
                            retry_policy: *grpc_retry

  clusters:
    - name: protocol
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 5s
      lb_policy: LEAST_REQUEST
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          # h2 to the protocol when the client spoke h2 (gRPC), HTTP/1.1 otherwise
          # (REST, WebSocket). The protocol serves both on one port.
          use_downstream_protocol_config:
            http_protocol_options: {}
            http2_protocol_options: {}
      load_assignment:
        cluster_name: protocol
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: protocol, port_value: 8080 }
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /readyz
      outlier_detection:
        consecutive_5xx: 5
        interval: 5s
        base_ejection_time: 30s
        max_ejection_percent: 50

