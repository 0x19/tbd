# Public edge on the host: Caddy terminates TLS for api.<base>, grafana.<base>,
# logs.<base>, profiles.<base> and metrics.<base>, and forwards to the cluster's host
# ports. Settings come from ./.env (copy .env.example); `mise run edge:up`.
#
# Needs router port forwards 80/tcp and 443/tcp -> this machine, and DNS records for
# the five names pointing at the public IP.
#
# EDGE_HTTP_PORT / EDGE_HTTPS_PORT change the host ports when 80/443 are taken; the
# router then forwards external 80 -> EDGE_HTTP_PORT and 443 -> EDGE_HTTPS_PORT.
name: tbd-edge
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      OBS_USER: ${OBS_USER:?set OBS_USER}
      OBS_PASSWORD_HASH: ${OBS_PASSWORD_HASH:?set OBS_PASSWORD_HASH (mise run edge:password)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # "cluster" resolves to the host, where k3d publishes the cluster's ports.
      - "cluster:host-gateway"
volumes:
  caddy-data:
  caddy-config:
