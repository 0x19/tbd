apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol
  labels:
    app.kubernetes.io/name: protocol
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: protocol
  template:
    metadata:
      labels:
        app.kubernetes.io/name: protocol
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: protocol
          # ORG is a placeholder; overlays pin the tag.
          image: ghcr.io/ORG/tbd-protocol:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tbd-env
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
