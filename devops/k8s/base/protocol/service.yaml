apiVersion: v1
kind: Service
metadata:
  name: protocol
  labels:
    app.kubernetes.io/name: protocol
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: protocol
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
