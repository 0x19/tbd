apiVersion: v1
kind: Service
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: llm
  ports:
    - name: grpc
      port: 50057
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
