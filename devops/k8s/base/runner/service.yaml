apiVersion: v1
kind: Service
metadata:
  name: runner
  labels:
    app.kubernetes.io/name: runner
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: runner
  ports:
    - name: grpc
      port: 50060
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
