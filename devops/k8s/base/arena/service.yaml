apiVersion: v1
kind: Service
metadata:
  name: arena
  labels:
    app.kubernetes.io/name: arena
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: arena
  ports:
    - name: grpc
      port: 50058
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
