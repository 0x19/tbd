apiVersion: v1
kind: ConfigMap
metadata:
  name: tbd-env
data:
  # Which configs/<service>/<env>.toml layer binaries load over base.toml.
  TBD_ENV: production
  RUST_LOG: info
  LOG_FORMAT: json
  ENGINE_LISTEN_ADDR: 0.0.0.0:50051
  ENGINE_METRICS_ADDR: 0.0.0.0:9464
  PROTOCOL_LISTEN_ADDR: 0.0.0.0:8080
  PROTOCOL_METRICS_ADDR: 0.0.0.0:9464
  HUMANS_LISTEN_ADDR: 0.0.0.0:50053
  HUMANS_METRICS_ADDR: 0.0.0.0:9464
  LEDGER_LISTEN_ADDR: 0.0.0.0:50052
  LEDGER_METRICS_ADDR: 0.0.0.0:9464
  # The ledger's store; its URL is in the ledger-db Secret.
  LEDGER_STORE_KIND: postgres
  # The protocol's backends ([services] in configs/protocol), every one through
  # Envoy's internal listener, which routes by gRPC service name; never straight
  # to a service. PROTOCOL_<NAME>_URL overrides [services.<name>] url.
  PROTOCOL_ENGINE_URL: http://envoy:50051
  PROTOCOL_HUMANS_URL: http://envoy:50051
  PROTOCOL_LEDGER_URL: http://envoy:50051
  # OTLP/gRPC collector for traces. Alloy in the observability namespace.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc:4317
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  # In-process CPU profiles. Unset to disable.
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.observability.svc:4040
