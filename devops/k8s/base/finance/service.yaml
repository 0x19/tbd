apiVersion: v1
kind: Service
metadata:
  name: finance
  labels:
    app.kubernetes.io/name: finance
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: finance
  ports:
    - name: grpc
      port: 50054
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
