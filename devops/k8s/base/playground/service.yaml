apiVersion: v1
kind: Service
metadata:
  name: playground
  labels:
    app.kubernetes.io/name: playground
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: playground
  ports:
    - name: grpc
      port: 50055
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
