apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  labels:
    app.kubernetes.io/name: cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cv
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: cv
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cv
          # Overlays pin the tag.
          image: ghcr.io/0x19/tbd-cv:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50056
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tbd-env
          env:
            # Both optional on purpose: without the database every RPC but Ping
            # answers UNAVAILABLE, and without the private fields the full CV
            # carries none -- a cluster before `mise run cv:secrets` still runs.
            - name: CV_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cv-db
                  key: database-url
                  optional: true
            - name: CV_PRIVATE_JSON
              valueFrom:
                secretKeyRef:
                  name: cv-private
                  key: private.json
                  optional: true
          livenessProbe:
            grpc:
              port: 50056
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50056
            initialDelaySeconds: 1
            periodSeconds: 5
          # A release binary keeps its symbols and the in-process profiler maps
          # them: every service idles at 170 to 290 MB resident. 256Mi was the
          # first thing a load run hit (OOMKilled at 2000 req/s on the ledger).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The in-process profiler (pprof-rs) needs a writable temp dir for
            # its sample buffers; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
