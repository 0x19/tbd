apiVersion: v1
kind: Service
metadata:
  name: ledger
  labels:
    app.kubernetes.io/name: ledger
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: ledger
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
