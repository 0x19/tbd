apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels:
    app.kubernetes.io/name: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: ledger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger
          # Overlays pin the tag.
          image: ghcr.io/0x19/tbd-ledger:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: tbd-env
          env:
            # The database URLs carry credentials: from the ledger-db Secret
            # (mise run ledger:secrets), never from the ConfigMap. Not optional:
            # a ledger without its store must not start.
            - name: LEDGER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-db
                  key: database-url
            - name: LEDGER_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-db
                  key: clickhouse-url
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The in-process profiler (pprof-rs) needs a writable temp dir for
            # its sample buffers; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
