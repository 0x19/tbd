apiVersion: v1
kind: Service
metadata:
  name: radar
  labels:
    app.kubernetes.io/name: radar
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: radar
  ports:
    - name: grpc
      port: 50059
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
