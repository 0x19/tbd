apiVersion: v1
kind: Service
metadata:
  name: envoy
  labels:
    app.kubernetes.io/name: envoy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envoy
  ports:
    - name: edge
      port: 8080
      targetPort: edge
      appProtocol: http
    - name: engine-lb
      port: 50051
      targetPort: engine-lb
      appProtocol: grpc
---
# Lets the Envoy config use the same `otel-collector` name in every environment.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  type: ExternalName
  externalName: otel-collector.observability.svc.cluster.local
---
# The identity stack lives in the `auth` namespace (devops/k8s/auth); these
# give Envoy the same short names in every environment.
apiVersion: v1
kind: Service
metadata:
  name: hydra
spec:
  type: ExternalName
  externalName: hydra-public.auth.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: kratos
spec:
  type: ExternalName
  externalName: kratos-public.auth.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: auth-ui
spec:
  type: ExternalName
  externalName: auth-ui.auth.svc.cluster.local
---
# Observability UIs, served through Envoy's gated virtual hosts.
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ExternalName
  externalName: grafana.observability.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  type: ExternalName
  externalName: victoria-logs.observability.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
spec:
  type: ExternalName
  externalName: pyroscope.observability.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
spec:
  type: ExternalName
  externalName: victoria-metrics.observability.svc.cluster.local
