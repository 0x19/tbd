apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels:
    app.kubernetes.io/name: envoy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: /stats/prometheus
      labels:
        app.kubernetes.io/name: envoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # envoy.yaml carries one environment-specific value, the browser-facing
        # authorization URL (__AUTH_PUBLIC_URL__); rendered here from tbd-edge.
        - name: render-config
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - 'test -n "$AUTH_PUBLIC_URL" && sed "s|__AUTH_PUBLIC_URL__|$AUTH_PUBLIC_URL|g" /template/envoy.yaml > /rendered/envoy.yaml'
          envFrom:
            - configMapRef:
                name: tbd-edge
          volumeMounts:
            - name: config
              mountPath: /template
            - name: rendered
              mountPath: /rendered
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1
          args:
            - -c
            - /rendered/envoy.yaml
            - --service-cluster
            - envoy
            - --service-node
            - $(POD_NAME)
            - --log-format
            - '{"timestamp":"%Y-%m-%dT%T.%e","level":"%l","message":"%v","logger":"%n"}'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: edge
              containerPort: 8080
            - name: engine-lb
              containerPort: 50051
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rendered
              mountPath: /rendered
              readOnly: true
            # OAuth2 client secret and cookie HMAC key for the browser login, as
            # file-based SDS resources (`mise run auth:envoy-secrets`).
            - name: oauth-secrets
              mountPath: /etc/envoy/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
        - name: rendered
          emptyDir: {}
        - name: oauth-secrets
          secret:
            secretName: envoy-oauth
            items:
              - key: token.yaml
                path: token.yaml
              - key: hmac.yaml
                path: hmac.yaml
