apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels:
    app.kubernetes.io/name: envoy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: /stats/prometheus
      labels:
        app.kubernetes.io/name: envoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --service-cluster
            - envoy
            - --service-node
            - $(POD_NAME)
            - --log-format
            - '{"timestamp":"%Y-%m-%dT%T.%e","level":"%l","message":"%v","logger":"%n"}'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: edge
              containerPort: 8080
            - name: engine-lb
              containerPort: 50051
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
