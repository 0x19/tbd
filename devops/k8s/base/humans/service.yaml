apiVersion: v1
kind: Service
metadata:
  name: humans
  labels:
    app.kubernetes.io/name: humans
spec:
  # Headless: Envoy resolves every pod and balances itself.
  clusterIP: None
  selector:
    app.kubernetes.io/name: humans
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
