# The ledger's own databases: Postgres (the source of truth) and ClickHouse
# (analytics fed by the outbox). Applied by `mise run ledger:deploy` after
# `ledger:secrets`; included by the local and dev overlays, never by prod,
# which brings managed instances and passes their URLs to `ledger:secrets`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tbd
resources:
  - postgres.yaml
  - clickhouse.yaml
configMapGenerator:
  - name: clickhouse-config
    files:
      - config/clickhouse.xml
generatorOptions:
  disableNameSuffixHash: true
