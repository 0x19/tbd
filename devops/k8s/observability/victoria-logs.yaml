# VictoriaLogs single-node: OTLP logs in from the collector, LogsQL out to Grafana.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  labels:
    app.kubernetes.io/name: victoria-logs
spec:
  serviceName: victoria-logs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.52.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -httpListenAddr=:9428
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
