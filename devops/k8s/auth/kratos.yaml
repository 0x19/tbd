# Ory Kratos. Same shape as Hydra: render the config, migrate, serve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  labels:
    app.kubernetes.io/name: kratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kratos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kratos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4434"
        prometheus.io/path: /admin/metrics/prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - sed "s|__AUTH_PUBLIC_URL__|$AUTH_PUBLIC_URL|g; s|__BASE_DOMAIN__|$BASE_DOMAIN|g" /template/kratos.yml > /config/kratos.yml && cp /template/identity.schema.json /template/oidc.*.jsonnet /config/ && sh /template/oidc.sh
          envFrom:
            - configMapRef:
                name: auth-env
          env:
            # Social sign-in credentials: present only after `mise run auth:oidc <provider> <id> <secret>`.
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: auth-secrets, key: oidc-google-id, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: auth-secrets, key: oidc-google-secret, optional: true } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: auth-secrets, key: oidc-github-id, optional: true } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: auth-secrets, key: oidc-github-secret, optional: true } }
          volumeMounts:
            - name: template
              mountPath: /template
            - name: config
              mountPath: /config
        - name: migrate
          image: oryd/kratos:v26.2.0
          args: ["migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml", "-c", "/etc/config/kratos/oidc.yml"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: kratos-dsn
          volumeMounts:
            - name: config
              mountPath: /etc/config/kratos
      containers:
        - name: kratos
          image: oryd/kratos:v26.2.0
          args: ["serve", "all", "-c", "/etc/config/kratos/kratos.yml", "-c", "/etc/config/kratos/oidc.yml"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: kratos-dsn
            - name: SECRETS_COOKIE
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: kratos-cookie
            - name: SECRETS_CIPHER
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: kratos-cipher
          ports:
            - name: public
              containerPort: 4433
            - name: admin
              containerPort: 4434
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/alive
              port: admin
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config/kratos
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: kratos-config
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-public
spec:
  selector:
    app.kubernetes.io/name: kratos
  ports:
    - name: http
      port: 4433
      targetPort: public
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-admin
spec:
  selector:
    app.kubernetes.io/name: kratos
  ports:
    - name: http
      port: 4434
      targetPort: admin
