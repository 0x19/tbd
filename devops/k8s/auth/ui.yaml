# The sign-in UI (ui/auth, Next.js on Ory Elements): login, registration,
# settings, recovery, verification, the Hydra consent step and global logout.
# Serves the root of auth.<domain>; Envoy sends the Hydra and Kratos API paths
# past it. Image: devops/docker/Dockerfile.auth-ui.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-ui
  labels:
    app.kubernetes.io/name: auth-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          # Overlays pin the tag.
          image: ghcr.io/0x19/tbd-auth-ui:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KRATOS_PUBLIC_URL
              value: http://kratos-public.auth.svc:4433
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin.auth.svc:4434
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin.auth.svc:4445
            - name: AUTH_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-env
                  key: AUTH_PUBLIC_URL
            # First-party clients: consent is granted without a screen.
            - name: TRUSTED_CLIENT_IDS
              value: tbd-ui,tbd-app
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-ui
spec:
  selector:
    app.kubernetes.io/name: auth-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
