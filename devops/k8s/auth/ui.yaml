# Ory's reference self-service UI: login, registration, settings, and the Hydra
# consent screen. Serves the root of auth.<domain>; Envoy sends the Hydra and
# Kratos API paths past it. To be replaced by our own pages (Ory Elements) later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-ui
  labels:
    app.kubernetes.io/name: auth-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-ui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: oryd/kratos-selfservice-ui-node:v26.2.0
          env:
            - name: PORT
              value: "3000"
            - name: KRATOS_PUBLIC_URL
              value: http://kratos-public.auth.svc:4433
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin.auth.svc:4434
            - name: KRATOS_BROWSER_URL
              valueFrom:
                configMapKeyRef:
                  name: auth-env
                  key: AUTH_PUBLIC_URL
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin.auth.svc:4445
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: ui-cookie
            - name: CSRF_COOKIE_NAME
              value: tbd_auth_csrf
            - name: CSRF_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: ui-csrf
            # First-party clients (skip_consent) are accepted without a consent screen.
            - name: TRUSTED_CLIENT_IDS
              value: tbd-ui,tbd-app
            - name: DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES
              valueFrom:
                configMapKeyRef:
                  name: auth-env
                  key: AUTH_INSECURE_COOKIES
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/alive
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-ui
spec:
  selector:
    app.kubernetes.io/name: auth-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
