# The identity stack: Postgres, Ory Hydra (OAuth2/OIDC), Ory Kratos (identities),
# the self-service UI, and the seeded OAuth2 clients. Applied on its own like
# observability/: `mise run auth:deploy` (writes auth.env first).
#
# Needs the `auth-secrets` Secret (`mise run auth:secrets`, never committed) and
# auth.env (git-ignored, written by `mise run local:edge-env`):
#   AUTH_PUBLIC_URL=https://auth.<domain>   BASE_DOMAIN=<domain>   AUTH_INSECURE_COOKIES=false
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources:
  - namespace.yaml
  - postgres.yaml
  - hydra.yaml
  - kratos.yaml
  - ui.yaml
  - seed-clients.yaml
configMapGenerator:
  - name: hydra-config
    files:
      - config/hydra.yml
  - name: kratos-config
    files:
      - config/kratos.yml
      - config/identity.schema.json
  - name: auth-env
    envs:
      - auth.env
