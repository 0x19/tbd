# Ory Kratos: identities, credentials, self-service flows. Rendered at pod start:
# __AUTH_PUBLIC_URL__ and __BASE_DOMAIN__ come from the auth-env ConfigMap.
serve:
  public:
    base_url: __AUTH_PUBLIC_URL__/
    host: 0.0.0.0
    port: 4433
  admin:
    base_url: http://kratos-admin.auth.svc:4434/
    host: 0.0.0.0
    port: 4434

# Hydra's admin API: Kratos completes Hydra login challenges itself, so no
# custom login provider is needed.
oauth2_provider:
  url: http://hydra-admin.auth.svc:4445

selfservice:
  default_browser_return_url: __AUTH_PUBLIC_URL__/welcome
  allowed_return_urls:
    - __AUTH_PUBLIC_URL__
    - https://__BASE_DOMAIN__
    - https://api.__BASE_DOMAIN__
    - https://chaosadmin.__BASE_DOMAIN__
    - https://grafana.__BASE_DOMAIN__
    - https://logs.__BASE_DOMAIN__
    - https://profiles.__BASE_DOMAIN__
    - https://metrics.__BASE_DOMAIN__
  methods:
    password:
      enabled: true
      config:
        min_password_length: 10
        identifier_similarity_check_enabled: true
        haveibeenpwned_enabled: false
    passkey:
      enabled: true
      config:
        rp:
          display_name: tbd
          id: __BASE_DOMAIN__
          origins:
            - __AUTH_PUBLIC_URL__
    totp:
      enabled: true
      config:
        issuer: tbd
    code:
      enabled: false
    link:
      enabled: false
    lookup_secret:
      enabled: true
  flows:
    error:
      ui_url: __AUTH_PUBLIC_URL__/error
    settings:
      ui_url: __AUTH_PUBLIC_URL__/settings
      privileged_session_max_age: 15m
      required_aal: highest_available
    # Recovery and verification need outbound email; off until an SMTP relay exists.
    recovery:
      enabled: false
      ui_url: __AUTH_PUBLIC_URL__/recovery
    verification:
      enabled: false
      ui_url: __AUTH_PUBLIC_URL__/verification
    logout:
      after:
        default_browser_return_url: __AUTH_PUBLIC_URL__/login
    login:
      ui_url: __AUTH_PUBLIC_URL__/login
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: __AUTH_PUBLIC_URL__/registration
      after:
        password:
          hooks:
            - hook: session
        passkey:
          hooks:
            - hook: session

session:
  lifespan: 720h
  cookie:
    same_site: Lax
    persistent: true
  whoami:
    required_aal: aal1

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

# Placeholder until an SMTP relay is configured; only recovery/verification use it.
courier:
  smtp:
    connection_uri: smtp://placeholder:1025/?disable_starttls=true

ciphers:
  algorithm: xchacha20-poly1305

log:
  level: info
  format: json
  leak_sensitive_values: false

tracing:
  provider: otel
  providers:
    otlp:
      server_url: otel-collector.observability.svc:4317
      insecure: true
      sampling:
        sampling_ratio: 1.0
