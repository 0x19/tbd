# Local k3d cluster: images imported from the docker daemon, Envoy exposed on
# host ports 18080/15051 through envoy-lb.yaml and k3d's load balancer,
# two protocol replicas and two engines so Envoy has something to balance,
# plus chaos serve (API + UI) reachable through Envoy at /api/chaos/v1 and http://chaos.localhost:18080/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../chaos
  - envoy-lb.yaml
images:
  - name: ghcr.io/0x19/tbd-engine
    newTag: dev
  - name: ghcr.io/0x19/tbd-protocol
    newTag: dev
  - name: ghcr.io/0x19/tbd-chaos
    newTag: dev
  - name: ghcr.io/0x19/tbd-ledger
    newTag: dev
  - name: ghcr.io/0x19/tbd-humans
    newTag: dev
patches:
  - target:
      kind: Deployment
      name: engine
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: protocol
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: ledger
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: humans
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
configMapGenerator:
  - name: tbd-env
    behavior: merge
    literals:
      - RUST_LOG=info,tbd=debug
      - TBD_ENV=local
  # Written by `mise run local:deploy` / `local:restart` from devops/edge/.env
  # (BASE_DOMAIN only). Empty when there is no public edge.
  - name: tbd-edge
    namespace: tbd
    envs:
      - edge.env
