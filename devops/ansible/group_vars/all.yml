---
# Non-secret defaults for every host. Secrets live in group_vars/vault.yml (ansible-vault).
registry: ghcr.io
image_org: 0x19                    # GitHub org that owns the images
engine_image: "{{ registry }}/{{ image_org }}/tbd-engine"
protocol_image: "{{ registry }}/{{ image_org }}/tbd-protocol"
humans_image: "{{ registry }}/{{ image_org }}/tbd-humans"
ledger_image: "{{ registry }}/{{ image_org }}/tbd-ledger"
# The ledger's databases; the same pins as compose.yaml and devops/k8s/ledger-db.
ledger_postgres_image: pgvector/pgvector:0.8.6-pg17-trixie
clickhouse_image: clickhouse/clickhouse-server:26.8.2.7
ledger_clickhouse_enabled: true

deploy_user: tbd
app_dir: /opt/tbd

engine_port: 50051
protocol_port: 8080
humans_port: 50053
ledger_port: 50052
rust_log: info
log_format: json

# Ports opened by the firewall role in bootstrap. 22 is always kept.
firewall_allow_tcp:
  - "{{ protocol_port }}"
