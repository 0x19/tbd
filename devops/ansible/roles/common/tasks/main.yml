---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Allow SSH through the firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow application ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allow_tcp }}"

- name: Enable firewall with default deny
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
