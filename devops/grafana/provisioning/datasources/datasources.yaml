# Grafana datasource provisioning. Mounted at /etc/grafana/provisioning/datasources.
# UIDs are stable and referenced by every dashboard under ../dashboards.
apiVersion: 1

datasources:
  - uid: victoriametrics
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics.observability.svc:8428
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      timeInterval: "15s"

  - uid: victorialogs
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs.observability.svc:9428
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Trace

  - uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo.observability.svc:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: 'trace_id:="${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: victoriametrics
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: Request rate
            query: 'sum by (route) (rate(tbd_requests_total{service="${__span.tags["service.name"]}"}[5m]))'
          - name: p99 latency
            query: 'histogram_quantile(0.99, sum by (le) (rate(tbd_request_duration_seconds_bucket{service="${__span.tags["service.name"]}"}[5m])))'
      serviceMap:
        datasourceUid: victoriametrics
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: victorialogs
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
