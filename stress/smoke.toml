# Every worker class on a memory ledger for three seconds: owners run the balanced
# mix of appends, reads at every page size, cuts, retractions, idempotent replays,
# relations, erasure cycles and expiring facts; contention workers hammer two shared
# subjects; a fuzz worker sends hostile requests. Every invariant holds. Runs on
# every `mise run ci`.

[campaign]
name = "smoke"
description = "Every invariant of every worker class on the memory store, three seconds, in CI."
duration = "3s"
warmup = "300ms"
seed = 1

[stack.ledgers.ledger-1]
grace = "0s"

[workload]
max_in_flight = 32

[workload.owner]
workers = 6
subjects = 2

[workload.contention]
workers = 4
subjects = 2

[workload.fuzz]
workers = 1
subjects = 1
