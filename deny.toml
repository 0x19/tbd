[graph]
# Not `all-features`: sqlx's optional `tls-native-tls` feature would pull
# openssl-sys, which the ban below forbids; the workspace never enables it.
all-features = false
exclude-unpublished = true

[advisories]
unmaintained = "workspace"
ignore = [
  # quick-xml 0.38 reaches us only through typst-library -> hayagriva -> citationberg
  # (the invoice renderer's citation support), and citationberg 0.7.0, the newest, pins
  # it there. Both advisories are denial of service on attacker-supplied XML; the only
  # XML that parser ever sees is the CSL styles bundled in the crate, never a caller's
  # bytes. Drop these the day citationberg moves to quick-xml >= 0.41.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg; parses bundled CSL styles only, no untrusted XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg; parses bundled CSL styles only, no untrusted XML" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "Unlicense",
  # 0BSD: public-domain-equivalent, via a Typst text-shaping dependency.
  "0BSD",
]

[bans]
# Transitive duplicate versions are a size cost, not a correctness one, and they
# churn with every dependency update. Inspect with `cargo tree -d` when curious.
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies carry no version on purpose; they are not wildcards.
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "rustls only" },
  { crate = "openssl-sys", reason = "rustls only" },
  { crate = "aws-lc-sys", reason = "ring is the one crypto provider; no second C build" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
